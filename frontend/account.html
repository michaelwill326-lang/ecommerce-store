<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Account</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.container{
max-width:420px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.error{
color:red;
font-size:14px;
margin-top:5px;
}

hr{
margin:25px 0;
}

</style>

</head>

<body>

<div class="container">

<h2>Customer Account</h2>

<div id="auth-section">

<h3>Create Account</h3>

<input id="reg-name" placeholder="Full Name">

<input id="reg-email" placeholder="Email">

<input id="reg-password" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>

<p class="error" id="register-error"></p>

<hr>

<h3>Login</h3>

<input id="login-email" placeholder="Email">

<input id="login-password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="error" id="login-error"></p>

</div>

<div id="dashboard" style="display:none">

<h3>Welcome</h3>

<p id="user-email"></p>

<button onclick="goOrders()">My Orders</button>

<button onclick="goWishlist()">Wishlist</button>

<button onclick="logout()">Logout</button>

</div>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

/* REGISTER */

async function register(){

const name=document.getElementById("reg-name").value
const email=document.getElementById("reg-email").value
const password=document.getElementById("reg-password").value

document.getElementById("register-error").innerText=""

try{

const res=await fetch(API+"/api/users/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({name,email,password})

})

const data=await res.json()

if(res.ok){

alert("Account created successfully")

loginAfterRegister(email,password)

}else{

document.getElementById("register-error").innerText=data.error

}

}catch(err){

document.getElementById("register-error").innerText="Server error"

}

}

/* LOGIN */

async function login(){

const email=document.getElementById("login-email").value
const password=document.getElementById("login-password").value

document.getElementById("login-error").innerText=""

try{

const res=await fetch(API+"/api/users/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({email,password})

})

const data=await res.json()

if(data.token){

localStorage.setItem("token",data.token)
localStorage.setItem("userEmail",data.user.email)

loadAccount()

}else{

document.getElementById("login-error").innerText=data.error

}

}catch(err){

document.getElementById("login-error").innerText="Server error"

}

}

/* AUTO LOGIN AFTER REGISTER */

function loginAfterRegister(email,password){

document.getElementById("login-email").value=email
document.getElementById("login-password").value=password

login()

}

/* LOAD ACCOUNT */

function loadAccount(){

const email=localStorage.getItem("userEmail")

if(!email) return

document.getElementById("auth-section").style.display="none"

document.getElementById("dashboard").style.display="block"

document.getElementById("user-email").innerText=email

}

loadAccount()

/* LOGOUT */

function logout(){

localStorage.removeItem("token")
localStorage.removeItem("userEmail")

location.reload()

}

/* NAVIGATION */

function goOrders(){

window.location.href="orders.html"

}

function goWishlist(){

window.location.href="wishlist.html"

}

</script>

</body>
</html>
