<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Account</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.container{
max-width:420px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

h2{
margin-top:0;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

hr{
margin:25px 0;
}

.dashboard{
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Customer Account</h2>

<!-- LOGIN + REGISTER -->

<div id="auth-section">

<h3>Login</h3>

<input id="login-email" placeholder="Email">

<input id="login-password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<hr>

<h3>Create Account</h3>

<input id="register-name" placeholder="Full Name">

<input id="register-email" placeholder="Email">

<input id="register-password" type="password" placeholder="Password">

<button onclick="register()">Register</button>

</div>

<!-- ACCOUNT DASHBOARD -->

<div id="account-section" style="display:none" class="dashboard">

<h3>Welcome</h3>

<p id="user-email"></p>

<button onclick="goOrders()">My Orders</button>

<button onclick="goWishlist()">Wishlist</button>

<button onclick="logout()">Logout</button>

</div>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

/* =========================
REGISTER
========================= */

async function register(){

const name=document.getElementById("register-name").value
const email=document.getElementById("register-email").value
const password=document.getElementById("register-password").value

const res=await fetch(API+"/api/users/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({name,email,password})

})

const data=await res.json()

alert(data.message || data.error)

}

/* =========================
LOGIN
========================= */

async function login(){

const email=document.getElementById("login-email").value
const password=document.getElementById("login-password").value

const res=await fetch(API+"/api/users/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({email,password})

})

const data=await res.json()

if(data.token){

localStorage.setItem("token",data.token)
localStorage.setItem("userEmail",data.user.email)

loadAccount()

}else{

alert(data.error)

}

}

/* =========================
LOAD ACCOUNT
========================= */

function loadAccount(){

const email=localStorage.getItem("userEmail")

if(!email) return

document.getElementById("auth-section").style.display="none"

document.getElementById("account-section").style.display="block"

document.getElementById("user-email").innerText=email

}

loadAccount()

/* =========================
LOGOUT
========================= */

function logout(){

localStorage.removeItem("token")
localStorage.removeItem("userEmail")

location.reload()

}

/* =========================
NAVIGATION
========================= */

function goOrders(){

window.location.href="orders.html"

}

function goWishlist(){

window.location.href="wishlist.html"

}

</script>

</body>
</html>
