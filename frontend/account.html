<!DOCTYPE html>
<html>
<head>
<title>My Account - TechMart</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;}
.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
}
</style>
</head>

<body>

<h2>📦 My Orders</h2>
<div id="orders"></div>

<script>

const API = "https://techmart-backend-ecbi.onrender.com";

async function loadOrders(){

  const token = localStorage.getItem("token");

  if(!token){
    alert("Login first");
    window.location = "login.html";
    return;
  }

  try{

    const res = await fetch(API + "/api/my-orders",{
      headers:{
        "Authorization":"Bearer " + token
      }
    });

    const orders = await res.json();

    const container = document.getElementById("orders");
    container.innerHTML = "";

    if(orders.length === 0){
      container.innerHTML = "<p>No orders yet</p>";
      return;
    }

    orders.forEach(o=>{
      container.innerHTML += `
        <div class="card">
          <p><strong>Amount:</strong> ₦${o.totalAmount}</p>
          <p><strong>Status:</strong> ${o.status}</p>
          <p><strong>Tracking:</strong> ${o.trackingNumber}</p>

          <a href="tracking.html?tracking=${o.trackingNumber}">
            Track Order
          </a>
        </div>
      `;
    });

  }catch(err){
    console.error(err);
  }

}

loadOrders();

</script>

</body>
</html>
