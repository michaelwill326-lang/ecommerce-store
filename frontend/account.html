<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | TechMart</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
    }

    button {
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Welcome, <span id="userName"></span></h2>

    <h3>Order History</h3>
    <table id="ordersTable">
      <tr>
        <th>Order ID</th>
        <th>Product</th>
        <th>Status</th>
      </tr>
      <!-- Orders will be displayed here -->
    </table>

    <button onclick="logout()">Logout</button>

  </div>

  <script>
    const API = "https://techmart-backend-ecbi.onrender.com";
    const token = localStorage.getItem("token");

    // Check if the user is logged in
    if (!token) {
      alert("Please log in to view your account.");
      window.location = "login.html";
    }

    // Function to load the user's data
    async function loadAccountData() {
      const res = await fetch(API + "/api/profile", {
        headers: { "Authorization": "Bearer " + token }
      });

      const data = await res.json();

      if (data.error) {
        alert("Error fetching profile data");
        window.location = "login.html";
      } else {
        document.getElementById("userName").textContent = data.name;
        loadOrders();
      }
    }

    // Function to load the user's orders
    async function loadOrders(){

const token = localStorage.getItem("token");

if(!token){
  alert("Please login");
  window.location = "login.html";
  return;
}

const res = await fetch(API + "/api/my-orders", {
  headers:{
    "Authorization": "Bearer " + token
  }
});

const orders = await res.json();

const table = document.getElementById("ordersTable");
table.innerHTML = "";

orders.forEach(o=>{
  table.innerHTML += `
    <tr>
      <td>${o._id || o.id}</td>
      <td>₦${o.totalAmount || "-"}</td>
      <td>${o.status}</td>
      <td>${new Date(o.createdAt || Date.now()).toLocaleDateString()}</td>
    </tr>
  `;
});

}

    // Function to log out the user
    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location = "login.html";
    }

    loadAccountData();
  </script>

</body>

</html>
