<!DOCTYPE html>
<html>

<head>
<title>My Account | TechMart</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

button{
padding:8px 14px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

.status{
padding:4px 8px;
border-radius:5px;
color:white;
font-size:12px;
}

.Processing{background:orange;}
.Shipped{background:blue;}
.Delivered{background:green;}
</style>

</head>

<body>

<div class="container">

<h1>My TechMart Account</h1>

<!-- PROFILE -->
<div class="card">
<h2>Profile</h2>

<p><strong>Name:</strong> <span id="userName"></span></p>
<p><strong>Email:</strong> <span id="userEmail"></span></p>

<button onclick="logout()">Logout</button>
</div>

<!-- ORDERS -->
<div class="card">
<h2>My Orders</h2>

<table>
<thead>
<tr>
<th>Order ID</th>
<th>Total</th>
<th>Status</th>
<th>Date</th>
<th>Track</th>
</tr>
</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

<!-- WISHLIST -->
<div class="card">
<h2>Wishlist</h2>
<div id="wishlist"></div>
</div>

</div>

<script>

const API = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   GET USER + TOKEN
=========================== */
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("userToken");

if(!user || !token){
  alert("Please login");
  window.location = "login.html";
}

/* ===========================
   SET PROFILE
=========================== */
document.getElementById("userName").textContent = user.name;
document.getElementById("userEmail").textContent = user.email;

/* ===========================
   LOGOUT
=========================== */
function logout(){
  localStorage.removeItem("userToken");
  localStorage.removeItem("user");
  window.location = "index.html";
}

/* ===========================
   LOAD ORDERS (FIXED)
=========================== */
async function loadOrders(){

  try{

    const res = await fetch(API + "/api/my-orders",{
      headers:{
        "Authorization": "Bearer " + token
      }
    });

    const orders = await res.json();

    const table = document.getElementById("ordersTable");
    table.innerHTML = "";

    if(!orders.length){
      table.innerHTML = "<tr><td colspan='5'>No orders yet</td></tr>";
      return;
    }

    orders.forEach(o => {

      table.innerHTML += `
      <tr>
        <td>${o._id}</td>
        <td>₦${o.totalAmount}</td>
        <td>
          <span class="status ${o.status}">
            ${o.status}
          </span>
        </td>
        <td>${new Date(o.createdAt).toLocaleDateString()}</td>
        <td>
          <a href="track-order.html?tracking=${o.trackingNumber}">
            Track
          </a>
        </td>
      </tr>
      `;
    });

  }catch(err){
    console.error(err);
  }

}

loadOrders();

/* ===========================
   WISHLIST
=========================== */
let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");

const container = document.getElementById("wishlist");

function renderWishlist(){

  container.innerHTML = "";

  if(wishlist.length === 0){
    container.innerHTML = "<p>No wishlist items</p>";
    return;
  }

  wishlist.forEach(p=>{
    container.innerHTML += `
    <div style="margin-bottom:10px">
      <a href="product.html?slug=${p.slug}">
        ${p.name}
      </a>
    </div>
    `;
  });

}

renderWishlist();

</script>

</body>
</html>
