<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Account</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.account-container{
background:white;
padding:30px;
border-radius:10px;
width:350px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h2{
margin-top:0;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
background:#2563eb;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

.divider{
margin:20px 0;
text-align:center;
font-weight:bold;
color:#888;
}

.message{
margin-top:10px;
text-align:center;
font-size:14px;
}

</style>

</head>

<body>

<div class="account-container">

<h2>Create Account</h2>

<input type="text" id="register-name" placeholder="Full Name">

<input type="email" id="register-email" placeholder="Email">

<input type="password" id="register-password" placeholder="Password">

<button onclick="register()">Create Account</button>

<div class="divider">OR</div>

<h2>Login</h2>

<input type="email" id="login-email" placeholder="Email">

<input type="password" id="login-password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="message" class="message"></p>

</div>

<script>

const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com"

const message = document.getElementById("message")

/* ===========================
   REGISTER
=========================== */

async function register(){

const name = document.getElementById("register-name").value.trim()
const email = document.getElementById("register-email").value.trim()
const password = document.getElementById("register-password").value.trim()

if(!name || !email || !password){

message.textContent = "Please fill all fields"
return

}

try{

const res = await fetch(`${BACKEND_URL}/api/users/register`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
email,
password
})

})

const data = await res.json()

if(data.error){

message.textContent = data.error

}else{

message.style.color="green"
message.textContent="Account created! Please login."

}

}catch(err){

message.textContent="Server error"

}

}

/* ===========================
   LOGIN
=========================== */

async function login(){

const email = document.getElementById("login-email").value.trim()
const password = document.getElementById("login-password").value.trim()

if(!email || !password){

message.textContent="Enter email and password"
return

}

try{

const res = await fetch(`${BACKEND_URL}/api/users/login`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

})

const data = await res.json()

if(data.error){

message.textContent = data.error

}else{

localStorage.setItem("token",data.token)

localStorage.setItem("user",JSON.stringify(data.user))

window.location.href="dashboard.html"

}

}catch(err){

message.textContent="Server error"

}

}

</script>

</body>
</html>
