<!DOCTYPE html>

<html>

<head>

<title>My Account | TechMart</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

button{
padding:8px 14px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h1>My TechMart Account</h1>

<!-- PROFILE -->

<div class="card">

<h2>Profile</h2>

<p><strong>Name:</strong> <span id="userName"></span></p>

<p><strong>Email:</strong> <span id="userEmail"></span></p>

<button onclick="logout()">Logout</button>

</div>

<!-- ORDERS -->

<div class="card">

<h2>My Orders</h2>

<table>

<thead>

<tr>
<th>Order ID</th>
<th>Total</th>
<th>Status</th>
<th>Date</th>
</tr>

</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

<!-- WISHLIST -->

<div class="card">

<h2>Wishlist</h2>

<div id="wishlist"></div>

</div>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

const user=JSON.parse(localStorage.getItem("user"))

if(!user){

alert("Please login")

window.location="login.html"

}

document.getElementById("userName").textContent=user.name
document.getElementById("userEmail").textContent=user.email

/* LOGOUT */

function logout(){

localStorage.removeItem("token")
localStorage.removeItem("user")

window.location="index.html"

}

/* LOAD ORDERS */

async function loadOrders(){

const res=await fetch(API+"/api/orders")

const orders=await res.json()

const table=document.getElementById("ordersTable")

table.innerHTML=""

orders
.filter(o=>o.email===user.email)
.forEach(o=>{

table.innerHTML+=`

<tr>

<td>${o._id}</td>

<td>₦${o.totalAmount}</td>

<td>${o.status}</td>

<td>${new Date(o.createdAt).toLocaleDateString()}</td>

</tr>

`

})

}

loadOrders()

/* WISHLIST */

let wishlist=JSON.parse(localStorage.getItem("wishlist")||"[]")

const container=document.getElementById("wishlist")

function renderWishlist(){

container.innerHTML=""

wishlist.forEach(p=>{

container.innerHTML+=`

<div style="margin-bottom:10px">

<a href="product.html?slug=${p.slug}">
${p.name}
</a>

</div>

`

})

}

renderWishlist()

</script>

</body>

</html>
