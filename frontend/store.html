<!DOCTYPE html>

<html>

<head>

<title>Seller Store | TechMart</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.product{
background:white;
padding:10px;
border-radius:8px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container">

<h1 id="store-title">Seller Store</h1>

<div id="store-products" class="grid"></div>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

const params=new URLSearchParams(window.location.search)

const sellerId=params.get("seller")

async function loadStore(){

const res=await fetch(`${API}/api/store/${sellerId}`)

const products=await res.json()

const container=document.getElementById("store-products")

container.innerHTML=""

products.forEach(p=>{

container.innerHTML+=`

<div class="product">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}" width="100%">
</a>

<h3>${p.name}</h3>

<p>₦${p.price}</p>

</div>

`

})

}

loadStore()

</script>

</body>

</html>
