<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order - TechMart</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

/* HEADER */
header{
background:#111827;
color:white;
padding:15px 20px;
}

/* CONTAINER */
.container{
max-width:600px;
margin:40px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

/* RESULT */
.result{
margin-top:25px;
}

/* STATUS BADGE */
.status-badge{
display:inline-block;
padding:6px 12px;
border-radius:6px;
background:#e5e7eb;
margin-top:5px;
}

/* PROGRESS */
.progress{
display:flex;
justify-content:space-between;
position:relative;
margin-top:30px;
}

/* LINE */
.progress::before{
content:"";
position:absolute;
top:12px;
left:0;
width:100%;
height:4px;
background:#ddd;
z-index:0;
}

/* STEP */
.step{
text-align:center;
z-index:1;
flex:1;
}

/* CIRCLE */
.circle{
width:25px;
height:25px;
border-radius:50%;
background:#ddd;
margin:auto;
}

/* ACTIVE */
.active{
background:#22c55e;
}

/* LABEL */
.step p{
font-size:13px;
margin-top:6px;
}

/* MOBILE */
@media(max-width:768px){
.container{
margin:20px;
}
}

</style>

</head>

<body>

<header>
<h2>📦 Track Your Order</h2>
</header>

<div class="container">

<input
type="text"
id="tracking"
placeholder="Enter Tracking Number"
/>

<button onclick="trackOrder()">Track Order</button>

<div class="result" id="result"></div>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com";

/* AUTO LOAD FROM URL */
const params = new URLSearchParams(window.location.search);
const trackingFromURL = params.get("tracking");

if (trackingFromURL) {
document.getElementById("tracking").value = trackingFromURL;
trackOrder();
}

/* TRACK ORDER */
async function trackOrder(){

const tracking = document.getElementById("tracking").value;

if(!tracking){
alert("Enter tracking number");
return;
}

try{

const res = await fetch(`${API}/api/track/${tracking}`);
const order = await res.json();

if(order.error){
document.getElementById("result").innerHTML =
"<p>❌ Order not found</p>";
return;
}

/* FIX STATUS NORMALIZATION */
const status = (order.status || "").toLowerCase();

let steps = ["processing","shipped","delivered"];

let progressHTML = '<div class="progress">';

steps.forEach(step=>{

const active = steps.indexOf(step) <= steps.indexOf(status);

progressHTML += `
<div class="step">
<div class="circle ${active ? "active" : ""}"></div>
<p>${step.charAt(0).toUpperCase() + step.slice(1)}</p>
</div>
`;

});

progressHTML += "</div>";

document.getElementById("result").innerHTML = `
<p><strong>Tracking:</strong> ${order.trackingNumber || "-"}</p>
<p><strong>Carrier:</strong> ${order.carrier || "-"}</p>

<p><strong>Status:</strong></p>
<div class="status-badge">${order.status}</div>

${progressHTML}
`;

}catch(err){
document.getElementById("result").innerHTML =
"<p>❌ Error fetching order</p>";
}

}

</script>

</body>
</html>
