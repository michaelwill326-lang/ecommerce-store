<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order - TechMart</title>

<style>

body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  text-align:center;
}

.container{
  max-width:600px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

input{
  width:80%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:5px;
}

button{
  padding:10px 20px;
  background:#0a7cff;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover{
  background:#085ec4;
}

.result{
  margin-top:20px;
  text-align:left;
}

.status{
  margin-top:15px;
  font-weight:bold;
}

/* Progress Bar */
.progress{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

.step{
  flex:1;
  text-align:center;
  position:relative;
}

.step::before{
  content:"";
  position:absolute;
  top:12px;
  left:0;
  right:0;
  height:4px;
  background:#ddd;
  z-index:-1;
}

.circle{
  width:25px;
  height:25px;
  margin:auto;
  border-radius:50%;
  background:#ddd;
  line-height:25px;
  color:white;
}

.active{
  background:green;
}

</style>

</head>

<body>

<div class="container">

<h2>📦 Track Your Order</h2>

<input
type="text"
id="tracking"
placeholder="Enter Tracking Number"
/>

<br>

<button onclick="trackOrder()">Track</button>

<div class="result" id="result"></div>

</div>

<script>

const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   AUTO LOAD FROM URL
=========================== */
const params = new URLSearchParams(window.location.search);
const trackingFromURL = params.get("tracking");

if (trackingFromURL) {
  document.getElementById("tracking").value = trackingFromURL;
  trackOrder();
}

/* ===========================
   TRACK ORDER
=========================== */
function trackOrder() {

  const tracking = document.getElementById("tracking").value;

  if (!tracking) {
    alert("Enter tracking number");
    return;
  }

  fetch(`${BACKEND_URL}/api/track/${tracking}`)
    .then(res => res.json())
    .then(order => {

      if (order.error) {
        document.getElementById("result").innerHTML =
          "<p>Order not found</p>";
        return;
      }

      let steps = ["Processing", "Shipped", "Delivered"];

      let progressHTML = '<div class="progress">';

      steps.forEach(step => {

        const active = steps.indexOf(step) <= steps.indexOf(order.status);

        progressHTML += `
          <div class="step">
            <div class="circle ${active ? "active" : ""}"></div>
            <p>${step}</p>
          </div>
        `;
      });

      progressHTML += "</div>";

      document.getElementById("result").innerHTML = `
        <p><strong>Tracking:</strong> ${order.trackingNumber}</p>
        <p><strong>Status:</strong> ${order.status}</p>
        <p><strong>Carrier:</strong> ${order.carrier}</p>
        ${progressHTML}
      `;

    })
    .catch(() => {
      document.getElementById("result").innerHTML =
        "<p>Error fetching order</p>";
    });

}

</script>

</body>
</html>
