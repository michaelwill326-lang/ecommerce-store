<!DOCTYPE html>
<html>
<head>

<title>Track Your Order</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
text-align:center;
}

.container{
background:white;
padding:30px;
border-radius:10px;
max-width:600px;
margin:auto;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
padding:10px;
width:60%;
margin:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px 20px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.progress{
margin-top:30px;
display:flex;
justify-content:space-between;
}

.step{
flex:1;
padding:10px;
font-size:14px;
}

.active{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>📦 Track Your Order</h2>

<input id="trackingInput" placeholder="Enter Tracking Number">

<br>

<button onclick="trackOrder()">Track</button>

<div id="result"></div>

<div class="progress">

<div id="step1" class="step">Order Placed</div>
<div id="step2" class="step">Processing</div>
<div id="step3" class="step">Shipped</div>
<div id="step4" class="step">Out for Delivery</div>
<div id="step5" class="step">Delivered</div>

</div>

</div>

<script>

const API_URL = "https://techmart-backend-ecbi.onrender.com"

async function trackOrder(trackingNumber){

let tracking = trackingNumber || document.getElementById("trackingInput").value

if(!tracking){
document.getElementById("result").innerHTML="⚠️ Please enter a tracking number"
return
}

try{

const res = await fetch(`${API_URL}/api/track/${tracking}`)

const data = await res.json()

if(data.error){
document.getElementById("result").innerHTML="❌ Tracking not found"
return
}

document.getElementById("trackingInput").value = tracking

document.getElementById("result").innerHTML = `
<p><b>Status:</b> ${data.status}</p>
<p><b>Carrier:</b> ${data.carrier}</p>
<p><b>Tracking Number:</b> ${data.trackingNumber}</p>
`

updateProgress(data.status)

}catch(err){

document.getElementById("result").innerHTML="❌ Error contacting server"

}

}

function updateProgress(status){

document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"))

document.getElementById("step1").classList.add("active")

if(status==="Processing"){
document.getElementById("step2").classList.add("active")
}

if(status==="Shipped"){
document.getElementById("step2").classList.add("active")
document.getElementById("step3").classList.add("active")
}

if(status==="Out for Delivery"){
document.getElementById("step2").classList.add("active")
document.getElementById("step3").classList.add("active")
document.getElementById("step4").classList.add("active")
}

if(status==="Delivered"){
document.querySelectorAll(".step").forEach(s=>s.classList.add("active"))
}

}

/* AUTO LOAD TRACKING FROM URL */

const params = new URLSearchParams(window.location.search)

const trackingFromURL = params.get("tracking")

if(trackingFromURL){
trackOrder(trackingFromURL)
}

</script>

</body>
</html>
