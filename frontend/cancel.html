<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Canceled</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .cancel-container {
      background: white;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    .crossmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e74c3c;
      margin: 0 auto 20px;
    }
    .crossmark svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 4;
      fill: none;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      color: #333;
    }
    p {
      color: #555;
      margin-top: 10px;
      font-size: 16px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #6772e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    a:hover {
      background: #5469d4;
    }
  </style>
</head>
<body>
  <div class="cancel-container">
    <div class="crossmark">
      <svg viewBox="0 0 52 52">
        <line x1="16" y1="16" x2="36" y2="36"/>
        <line x1="36" y1="16" x2="16" y2="36"/>
      </svg>
    </div>
    <h1>Payment Canceled</h1>
    <p>Your payment was not completed.  
       Don’t worry, you can try again anytime.</p>
    <a href="cart.html">Return to Cart</a>
  </div>
</body>
</html>
