<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - TechMart</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

header{
background:#111827;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:white;
text-decoration:none;
margin-left:20px;
}

.dashboard{
max-width:1000px;
margin:40px auto;
display:grid;
grid-template-columns:250px 1fr;
gap:20px;
}

.sidebar{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.sidebar h3{
margin-top:0;
}

.sidebar button{
display:block;
width:100%;
padding:10px;
margin-bottom:10px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.sidebar button:hover{
background:#1d4ed8;
}

.content{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.order{
border-bottom:1px solid #ddd;
padding:10px 0;
}

</style>

</head>

<body>

<header>

<h2>🛒 TechMart</h2>

<div>

<a href="index.html">Home</a> <a href="cart.html">Cart</a>

</div>

</header>

<div class="dashboard">

<div class="sidebar">

<h3>My Account</h3>

<button onclick="loadOrders()">My Orders</button>

<button onclick="logout()">Logout</button>

</div>

<div class="content">

<h3 id="content-title">Welcome</h3>

<div id="content-area">

<p>Welcome to your TechMart account.</p>

</div>

</div>

</div>

<script>

const BACKEND_URL="https://techmart-backend-ecbi.onrender.com"

const user = JSON.parse(localStorage.getItem("user"))

if(!user){

alert("Please login")

window.location.href="account.html"

}

async function loadOrders(){

document.getElementById("content-title").textContent="My Orders"

const container=document.getElementById("content-area")

container.innerHTML="Loading orders..."

try{

const res = await fetch(`${BACKEND_URL}/api/orders`)

const orders = await res.json()

const userOrders = orders.filter(o => o.email === user.email)

if(userOrders.length === 0){

container.innerHTML="<p>No orders yet.</p>"

return

}

container.innerHTML=""

userOrders.forEach(order=>{

container.innerHTML += `

<div class="order">

<p><strong>Order ID:</strong> ${order._id}</p>

<p><strong>Total:</strong> ₦${order.totalAmount}</p>

<p><strong>Status:</strong> ${order.status}</p>

<p><strong>Date:</strong> ${new Date(order.createdAt).toLocaleDateString()}</p>

</div>

`

})

}catch(err){

container.innerHTML="Failed to load orders"

}

}

function logout(){

localStorage.removeItem("token")
localStorage.removeItem("user")

window.location.href="index.html"

}

</script>

</body>
</html>
