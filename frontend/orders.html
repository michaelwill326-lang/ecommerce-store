<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
padding:40px;
background:#f4f6f9;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
}

.review{
border-bottom:1px solid #eee;
padding:10px 0;
}

.star{
color:gold;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1 id="product-name"></h1>

<img id="product-image" width="250">

<p id="product-description"></p>

<h2 id="product-price"></h2>

<button onclick="addToCart()">Add to Cart</button>

<hr>

<h2>⭐ Reviews</h2>

<div id="reviews"></div>

<hr>

<h3>Leave a Review</h3>

<input id="review-name" placeholder="Your Name">

<br><br>

<select id="review-rating">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<br><br>

<textarea id="review-comment" placeholder="Write review"></textarea>

<br><br>

<button onclick="submitReview()">Submit Review</button>

</div>

<script>

const BACKEND_URL="https://techmart-backend-ecbi.onrender.com"

const slug=new URLSearchParams(window.location.search).get("slug")

let product

async function loadProduct(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}`)

product=await res.json()

document.getElementById("product-name").innerText=product.name

document.getElementById("product-image").src=product.image

document.getElementById("product-description").innerText=product.description

document.getElementById("product-price").innerText=`₦${product.price}`

loadReviews()

}

function addToCart(){

let cart=JSON.parse(localStorage.getItem("cart"))||[]

const existing=cart.find(i=>i._id===product._id)

if(existing){

existing.quantity++

}else{

cart.push({...product,quantity:1})

}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

async function loadReviews(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`)

const reviews=await res.json()

const container=document.getElementById("reviews")

container.innerHTML=""

reviews.forEach(r=>{

let stars=""

for(let i=0;i<r.rating;i++){

stars+="⭐"

}

container.innerHTML+=`

<div class="review">

<strong>${r.name}</strong>

<div class="star">${stars}</div>

<p>${r.comment}</p>

</div>

`

})

}

async function submitReview(){

const name=document.getElementById("review-name").value

const rating=document.getElementById("review-rating").value

const comment=document.getElementById("review-comment").value

await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({name,rating,comment})

})

document.getElementById("review-comment").value=""

loadReviews()

}

loadProduct()

</script>

</body>
</html>
