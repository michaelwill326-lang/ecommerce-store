<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - TechMart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .thankyou-container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    .checkmark {
      font-size: 60px;
      color: #4CAF50;
      margin-bottom: 20px;
    }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #555; margin-bottom: 20px; }
    ul { list-style: none; padding: 0; margin-bottom: 20px; }
    ul li { text-align: left; padding: 6px 0; border-bottom: 1px solid #eee; }
    .total { font-weight: bold; margin-top: 10px; }
    a {
      display: inline-block;
      padding: 12px 20px;
      background: #4CAF50;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
      margin-top: 15px;
    }
    a:hover { background: #45a049; }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <div class="checkmark">✔</div>
    <h1>Thank You!</h1>
    <p>Your order has been placed successfully.</p>

    <h3>Order Summary</h3>
    <ul id="order-items"></ul>
    <p class="total" id="order-total"></p>

    <p id="payment-reference">Payment Reference: Loading...</p>

    <a href="index.html">Continue Shopping</a>
  </div>
  <a href="track-order.html">
    Track My Order
    </a>
  <script>
    const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com";

    // Clear cart
    localStorage.removeItem("cart");

    async function loadOrder() {
      try {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("orderId");

        if (!orderId) {
          document.getElementById("payment-reference").textContent = "Order not found.";
          return;
        }

        const response = await fetch(`${BACKEND_URL}/api/orders/${orderId}`);
        const order = await response.json();

        if (!order || order.error) {
          document.getElementById("payment-reference").textContent = "Order not found.";
          return;
        }

        const orderList = document.getElementById("order-items");
        const orderTotal = document.getElementById("order-total");

        let total = 0;
        orderList.innerHTML = "";

        order.items.forEach(item => {
          const li = document.createElement("li");
          li.textContent =
            `${item.name} x ${item.quantity} — $${(item.price * item.quantity).toFixed(2)}`;
          orderList.appendChild(li);
          total += item.price * item.quantity;
        });

        orderTotal.textContent = "Total: $" + total.toFixed(2);

        document.getElementById("payment-reference").textContent =
          "Payment Reference: " + order.paymentReference;

      } catch (error) {
        console.error("Error loading order:", error);
        document.getElementById("payment-reference").textContent =
          "Could not load order details.";
      }
    }

    loadOrder();
  </script>

</body>
</html>
