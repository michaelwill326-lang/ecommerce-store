<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - TechMart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .thankyou-container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    .checkmark {
      font-size: 60px;
      color: #4CAF50;
      margin-bottom: 20px;
    }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #555; margin-bottom: 20px; }
    ul { list-style: none; padding: 0; margin-bottom: 20px; }
    ul li { text-align: left; padding: 6px 0; border-bottom: 1px solid #eee; }
    .total { font-weight: bold; margin-top: 10px; }
    a {
      display: inline-block;
      padding: 12px 20px;
      background: #4CAF50;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
      margin-top: 15px;
    }
    a:hover { background: #45a049; }
    #trackOrderBtn {
      padding: 12px 20px;
      background: #2196F3;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    #trackOrderBtn:hover { background: #1976D2; }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <div class="checkmark">✔</div>
    <h1>Thank You!</h1>
    <p>Your order has been placed successfully.</p>

    <h3>Order Summary</h3>
    <ul id="order-items"></ul>
    <p class="total" id="order-total"></p>

    <p id="tracking-number">📦 Tracking Number: Loading...</p>

    <button id="trackOrderBtn">📦 Track My Order</button>
    <br>
    <a href="index.html">Continue Shopping</a>
  </div>

  <script>
    localStorage.removeItem("cart");

    let trackingNumber = "";

    async function loadOrder() {
      try {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("order_id");

        if (!orderId) {
          document.getElementById("tracking-number").textContent = "Order not found.";
          return;
        }

        const res = await fetch("/api/orders/" + orderId);
        const order = await res.json();

        if (!order || !order.items) return;

        trackingNumber = order.tracking_number || "";

        document.getElementById("tracking-number").textContent =
          trackingNumber ? "📦 Tracking Number: " + trackingNumber : "Tracking not available yet";

        const items = typeof order.items === "string" ? JSON.parse(order.items) : order.items;
        const orderList = document.getElementById("order-items");
        const orderTotal = document.getElementById("order-total");

        let total = 0;
        orderList.innerHTML = "";
        items.forEach(function(item) {
          const li = document.createElement("li");
          li.textContent = item.name + " x " + item.quantity + " — $" + (item.price * item.quantity).toFixed(2);
          orderList.appendChild(li);
          total += item.price * item.quantity;
        });

        orderTotal.textContent = "Total: $" + total.toFixed(2);

      } catch (err) {
        console.error("Failed to load order:", err);
        document.getElementById("tracking-number").textContent = "Could not load order details.";
      }
    }

    loadOrder();

    document.getElementById("trackOrderBtn").addEventListener("click", function() {
      if (trackingNumber) {
        window.location.href = "track-order.html?tracking=" + trackingNumber;
      } else {
        alert("Tracking number not available yet.");
      }
    });
  </script>

</body>
</html>
