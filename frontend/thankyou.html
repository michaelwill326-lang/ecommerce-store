<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation - TechMart</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  text-align:center;
}

.container{
  max-width:600px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

h1{
  color:green;
}

.items{
  text-align:left;
  margin-top:20px;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.total{
  font-weight:bold;
  margin-top:15px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#0a7cff;
  color:white;
  text-decoration:none;
  border-radius:6px;
}

.btn:hover{
  background:#085ec4;
}
</style>

</head>

<body>

<div class="container">

<h1>✅ Payment Successful</h1>

<p>Your order has been placed successfully 🎉</p>

<p id="order-id"></p>

<div class="items" id="items"></div>

<p class="total" id="total"></p>

<p id="status"></p>

<a id="track-btn" class="btn">Track Order</a>

</div>

<script>
const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com";

const params = new URLSearchParams(window.location.search);
const orderId = params.get("orderId");

if (!orderId) {
  document.body.innerHTML = "<h2>Invalid Order</h2>";
}

/* ===========================
   FETCH ORDER
=========================== */
fetch(`${BACKEND_URL}/api/orders/${orderId}`)
  .then(res => res.json())
  .then(order => {

    document.getElementById("order-id").innerHTML =
      `<strong>Order ID:</strong> ${order._id}`;

    const itemsDiv = document.getElementById("items");

    order.items.forEach(item => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <span>${item.name} × ${item.quantity}</span>
        <span>₦${(item.price * item.quantity).toFixed(2)}</span>
      `;
      itemsDiv.appendChild(div);
    });

    document.getElementById("total").innerText =
      `Total: ₦${order.totalAmount.toFixed(2)}`;

    document.getElementById("status").innerHTML =
      `<strong>Status:</strong> ${order.status}`;

    document.getElementById("track-btn").href =
      `track.html?tracking=${order.trackingNumber}`;

  })
  .catch(() => {
    document.body.innerHTML = "<h2>Error loading order</h2>";
  });
</script>

</body>
</html>
