<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Orders</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #222;
  color: white;
}

button {
  padding: 6px 10px;
  margin: 2px;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}

.processing { background: #ffc107; }
.shipped { background: #0dcaf0; }
.out { background: #fd7e14; }
.delivered { background: #198754; color: white; }

.status {
  font-weight: bold;
  text-transform: capitalize;
}
</style>
</head>
<body>

<h1>📦 Admin Order Management</h1>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Customer</th>
  <th>Tracking</th>
  <th>Status</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="ordersTable"></tbody>
</table>

<script>
async function loadOrders() {
  const res = await fetch("/api/orders/latest?all=true");
  const data = await fetch("/api/admin/orders");
  const orders = await data.json();

  const table = document.getElementById("ordersTable");
  table.innerHTML = "";

  orders.forEach(order => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${order.id}</td>
      <td>${order.name}</td>
      <td>${order.tracking_number}</td>
      <td class="status">${order.status}</td>
      <td>
        <button class="processing" onclick="updateStatus(${order.id}, 'processing')">Processing</button>
        <button class="shipped" onclick="updateStatus(${order.id}, 'shipped')">Shipped</button>
        <button class="out" onclick="updateStatus(${order.id}, 'out-for-delivery')">Out</button>
        <button class="delivered" onclick="updateStatus(${order.id}, 'delivered')">Delivered</button>
      </td>
    `;
    table.appendChild(tr);
  });
}

async function updateStatus(orderId, status) {
  await fetch("/api/orders/update-status", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ orderId, status })
  });

  loadOrders();
}

loadOrders();
</script>

</body>
</html>
