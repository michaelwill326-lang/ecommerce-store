<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - TechMart</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:30px;
}

.product-page{
max-width:1000px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.image-gallery{
position:relative;
}

#main-image{
width:100%;
border-radius:10px;
transition:transform .3s;
cursor:zoom-in;
}

#main-image:hover{
transform:scale(1.2);
}

.thumbnail-row{
display:flex;
margin-top:10px;
gap:10px;
}

.thumbnail-row img{
width:60px;
height:60px;
object-fit:cover;
cursor:pointer;
border-radius:6px;
border:2px solid transparent;
}

.thumbnail-row img:hover{
border:2px solid #2563eb;
}

.price{
font-size:26px;
font-weight:bold;
margin:10px 0;
}

button{
padding:10px 14px;
margin-right:10px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#stock-warning{
margin:10px 0;
font-weight:bold;
color:#b91c1c;
}

.reviews{
margin-top:40px;
}

.review{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.recommendations{
margin-top:40px;
}

.recommendations .product{
display:inline-block;
width:200px;
margin-right:15px;
}

</style>

</head>

<body>

<h1 id="product-name"></h1>

<div class="product-page">

<div class="image-gallery">

<img id="main-image">

<div class="thumbnail-row" id="thumbnail-row"></div>

</div>

<div>

<p id="product-description"></p>

<div class="price" id="product-price"></div>

<div id="product-rating"></div>

<div id="stock-warning"></div>

<button id="add-cart">Add to Cart</button>

<button id="wishlist-btn">❤️ Wishlist</button>

</div>

</div>

<!-- REVIEWS -->

<div class="reviews">

<h2>Customer Reviews</h2>

<div id="reviews-list"></div>

<h3>Leave a Review</h3>

<input id="review-name" placeholder="Your Name">

<select id="review-rating">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<textarea id="review-comment" placeholder="Write your review"></textarea>

<br><br>

<button onclick="submitReview()">Submit Review</button>

</div>

<!-- RECOMMENDATIONS -->

<div class="recommendations">

<h2>Recommended Products</h2>

<div id="recommendations"></div>

</div>

<!-- ALSO BOUGHT -->

<div class="recommendations">

<h2>Customers Also Bought</h2>

<div id="also-bought"></div>

</div>

<script>

const BACKEND_URL="https://techmart-backend-ecbi.onrender.com"

const params=new URLSearchParams(window.location.search)
const slug=params.get("slug")

let productData=null

/* LOAD PRODUCT */

async function loadProduct(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}`)
const product=await res.json()

productData=product

document.getElementById("product-name").textContent=product.name

document.getElementById("product-description").textContent=
product.description || ""

document.getElementById("product-price").textContent=
"₦"+product.price

/* Image gallery */

const mainImage=document.getElementById("main-image")
const thumbnails=document.getElementById("thumbnail-row")

mainImage.src=product.image

thumbnails.innerHTML=""

const images=[product.image]

images.forEach(img=>{

thumbnails.innerHTML+=`
<img src="${img}" onclick="changeImage('${img}')">
`

})

/* Rating */

if(product.reviews.length){

let total=0

product.reviews.forEach(r=>total+=r.rating)

let avg=(total/product.reviews.length).toFixed(1)

document.getElementById("product-rating").textContent=
"⭐".repeat(Math.round(avg))+" ("+product.reviews.length+" reviews)"

}else{

document.getElementById("product-rating").textContent="No ratings yet"

}

/* Stock warning */

if(product.stock<=5){

document.getElementById("stock-warning").textContent=
"⚠ Only "+product.stock+" left in stock!"

}

/* SEO schema */

addProductSchema(product)

loadReviews()
loadRecommendations()
loadAlsoBought()

}

/* IMAGE SWITCH */

function changeImage(src){

document.getElementById("main-image").src=src

}

/* ADD TO CART */

document.getElementById("add-cart").onclick=function(){

let cart=JSON.parse(localStorage.getItem("cart")) || []

const existing=cart.find(i=>i.id===productData._id)

if(existing){

existing.quantity++

}else{

cart.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image,
quantity:1
})

}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

/* WISHLIST */

document.getElementById("wishlist-btn").onclick=function(){

let wishlist=JSON.parse(localStorage.getItem("wishlist")) || []

const existing=wishlist.find(i=>i.id===productData._id)

if(existing){
alert("Already in wishlist")
return
}

wishlist.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image
})

localStorage.setItem("wishlist",JSON.stringify(wishlist))

alert("Added to wishlist")

}

/* LOAD REVIEWS */

async function loadReviews(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}`)
const product=await res.json()

const reviews=product.reviews

const container=document.getElementById("reviews-list")

container.innerHTML=""

if(!reviews.length){

container.innerHTML="<p>No reviews yet.</p>"
return

}

reviews.forEach(r=>{

container.innerHTML+=`

<div class="review">

<strong>${r.name}</strong>

<p>${"⭐".repeat(r.rating)}</p>

<p>${r.comment}</p>

</div>

`

})

}

/* SUBMIT REVIEW */

async function submitReview(){

const name=document.getElementById("review-name").value
const rating=document.getElementById("review-rating").value
const comment=document.getElementById("review-comment").value

await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
rating,
comment
})

})

document.getElementById("review-comment").value=""

loadReviews()

}

/* RECOMMENDATIONS */

async function loadRecommendations(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}/recommendations`)
const products=await res.json()

const container=document.getElementById("recommendations")

container.innerHTML=""

products.forEach(p=>{

container.innerHTML+=`

<div class="product">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}" style="width:100%">
</a>

<p>${p.name}</p>
<p>₦${p.price}</p>

</div>

`

})

}

/* ALSO BOUGHT */

async function loadAlsoBought(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}/also-bought`)
const products=await res.json()

const container=document.getElementById("also-bought")

container.innerHTML=""

products.forEach(p=>{

container.innerHTML+=`

<div class="product">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}" style="width:100%">
</a>

<p>${p.name}</p>
<p>₦${p.price}</p>

</div>

`

})

}

/* SEO PRODUCT SCHEMA */

function addProductSchema(product){

const schema={
"@context":"https://schema.org/",
"@type":"Product",
"name":product.name,
"image":[product.image],
"description":product.description || product.name,
"sku":product._id,

"offers":{
"@type":"Offer",
"url":window.location.href,
"priceCurrency":"USD",
"price":product.price,
"availability":"https://schema.org/InStock"
},

"aggregateRating":{
"@type":"AggregateRating",
"ratingValue": product.reviews.length
? (product.reviews.reduce((a,b)=>a+b.rating,0)/product.reviews.length).toFixed(1)
: 5,
"reviewCount":product.reviews.length || 1
}

}

const script=document.createElement("script")
script.type="application/ld+json"
script.text=JSON.stringify(schema)

document.head.appendChild(script)

}

loadProduct()

</script>

</body>
</html>
