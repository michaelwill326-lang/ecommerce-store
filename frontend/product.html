<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#111827;
color:white;
padding:15px 20px;
}

.container{
max-width:1000px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
}

/* GRID */
.product{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

/* IMAGE */
.product img{
width:100%;
border-radius:10px;
}

/* INFO */
.price{
font-size:22px;
font-weight:bold;
margin:10px 0;
}

button{
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}

.add{
background:#2563eb;
color:white;
}

.buy{
background:#16a34a;
color:white;
}

/* REVIEWS */
.review{
border-bottom:1px solid #ddd;
padding:10px 0;
}

/* MOBILE */
@media (max-width:768px){

.product{
grid-template-columns:1fr;
}

button{
width:100%;
margin-bottom:10px;
}

}

</style>

</head>

<body>

<header>
<h2>🛒 TechMart</h2>
</header>

<div class="container">

<div class="product">

<div>
<img id="productImage">
</div>

<div>
<h2 id="productName"></h2>
<div class="price" id="productPrice"></div>
<p id="productDesc"></p>

<button class="add" onclick="addToCart()">Add to Cart</button>
<button class="buy" onclick="buyNow()">Buy Now</button>

</div>

</div>

<h3>⭐ Reviews</h3>
<div id="reviews"></div>

<h4>Add Review</h4>
<input id="name" placeholder="Name"><br><br>
<input id="rating" placeholder="Rating"><br><br>
<textarea id="comment" placeholder="Comment"></textarea><br><br>
<button onclick="addReview()">Submit</button>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

const slug = new URLSearchParams(window.location.search).get("slug")

let currentProduct=null

async function loadProduct(){

const res = await fetch(`${API}/api/products/${slug}`)
const p = await res.json()

currentProduct=p

document.getElementById("productName").textContent=p.name
document.getElementById("productPrice").textContent="₦"+p.price
document.getElementById("productDesc").textContent=p.description
document.getElementById("productImage").src=p.image

const reviews=document.getElementById("reviews")
reviews.innerHTML=""

p.reviews.forEach(r=>{
reviews.innerHTML+=`
<div class="review">
<strong>${r.name}</strong> ⭐${r.rating}
<p>${r.comment}</p>
</div>
`
})

}

function addToCart(){

let cart = JSON.parse(localStorage.getItem("cart")) || []

const existing = cart.find(i=>i.id===currentProduct._id)

if(existing){
existing.quantity++
}else{
cart.push({
id:currentProduct._id,
name:currentProduct.name,
price:currentProduct.price,
quantity:1
})
}

localStorage.setItem("cart", JSON.stringify(cart))

alert("Added to cart")

}

function buyNow(){
addToCart()
window.location="checkout.html"
}

async function addReview(){

await fetch(`${API}/api/products/${slug}/reviews`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value,
rating:document.getElementById("rating").value,
comment:document.getElementById("comment").value
})
})

alert("Review added")
loadProduct()

}

loadProduct()

</script>

</body>
</html>
