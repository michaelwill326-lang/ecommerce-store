<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:30px;
}

.product-page{
max-width:1000px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.product-page img{
width:100%;
border-radius:10px;
}

.recommendations{
margin-top:40px;
}

.recommendations .product{
display:inline-block;
width:200px;
margin-right:15px;
}

</style>

</head>

<body>

<h1 id="product-name"></h1>

<div class="product-page">

<img id="product-image">

<div>

<p id="product-description"></p>

<h2 id="product-price"></h2>

<button id="add-cart">Add to Cart</button>

<button id="wishlist-btn">❤️ Wishlist</button>

</div>

</div>

<div class="recommendations">

<h2>Recommended Products</h2>

<div id="recommendations"></div>

</div>

<script>

const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com"

const params = new URLSearchParams(window.location.search)

const slug = params.get("slug")

let productData = null

async function loadProduct(){

const res = await fetch(`${BACKEND_URL}/api/products/${slug}`)

const product = await res.json()

productData = product

document.getElementById("product-name").textContent = product.name
document.getElementById("product-image").src = product.image
document.getElementById("product-description").textContent = product.description
document.getElementById("product-price").textContent = "₦" + product.price

}

async function loadRecommendations(){

const res = await fetch(`${BACKEND_URL}/api/products/${slug}/recommendations`)

const products = await res.json()

const container = document.getElementById("recommendations")

products.forEach(p=>{

container.innerHTML += `

<div class="product">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}" style="width:100%">
</a>

<p>${p.name}</p>

<p>₦${p.price}</p>

</div>

`

})

}

document.getElementById("add-cart").onclick = function(){

let cart = JSON.parse(localStorage.getItem("cart")) || []

const existing = cart.find(i => i.id === productData._id)

if(existing){

existing.quantity++

}else{

cart.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image,
quantity:1
})

}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

document.getElementById("wishlist-btn").onclick = function(){

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || []

const existing = wishlist.find(i => i.id === productData._id)

if(existing){

alert("Already in wishlist")

return

}

wishlist.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image
})

localStorage.setItem("wishlist",JSON.stringify(wishlist))

alert("Added to wishlist")

}

loadProduct()
loadRecommendations()

</script>

</body>
</html>
