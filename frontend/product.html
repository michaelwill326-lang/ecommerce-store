<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Product - TechMart</title>

<!-- SEO META -->

<meta name="description" content="Buy high quality electronics at TechMart. Best deals on headphones, gaming keyboards, and monitors.">

<meta name="keywords" content="electronics store, headphones, gaming keyboard, monitors">

<meta name="author" content="TechMart">

<meta property="og:title" content="TechMart Electronics Store">

<meta property="og:description" content="Best electronics deals online">

<meta property="og:type" content="website">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:30px;
}

.product-page{
max-width:1000px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.product-page img{
width:100%;
border-radius:10px;
}

button{
padding:10px 14px;
margin-right:10px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.reviews{
margin-top:40px;
}

.review{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.recommendations{
margin-top:40px;
}

.recommendations .product{
display:inline-block;
width:200px;
margin-right:15px;
background:white;
padding:10px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h1 id="product-name"></h1>

<div class="product-page">

<img id="product-image" loading="lazy">

<div>

<p id="product-description"></p>

<h2 id="product-price"></h2>

<button id="add-cart">Add to Cart</button>

<button id="wishlist-btn">❤️ Wishlist</button>

</div>

</div>

<!-- REVIEWS -->

<div class="reviews">

<h2>Customer Reviews</h2>

<div id="reviews-list"></div>

<h3>Leave a Review</h3>

<input id="review-name" placeholder="Your Name">

<select id="review-rating">

<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>

</select>

<textarea id="review-comment" placeholder="Write your review"></textarea>

<br><br>

<button onclick="submitReview()">Submit Review</button>

</div>

<!-- RECOMMENDATIONS -->

<div class="recommendations">

<h2>Recommended Products</h2>

<div id="recommendations"></div>

</div>

<script>

const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com"

const params = new URLSearchParams(window.location.search)
const slug = params.get("slug")

let productData = null

/* LOAD PRODUCT */

async function loadProduct(){

const res = await fetch(`${BACKEND_URL}/api/products/${slug}`)
const product = await res.json()

productData = product

document.getElementById("pageTitle").textContent = product.name + " - TechMart"

document.getElementById("product-name").textContent = product.name
document.getElementById("product-image").src = product.image
document.getElementById("product-description").textContent = product.description
document.getElementById("product-price").textContent = "₦" + product.price

createStructuredData(product)

loadReviews()

}

/* ADD TO CART */

document.getElementById("add-cart").onclick = function(){

let cart = JSON.parse(localStorage.getItem("cart")) || []

const existing = cart.find(i => i.id === productData._id)

if(existing){
existing.quantity++
}else{
cart.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image,
quantity:1
})
}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

/* WISHLIST */

document.getElementById("wishlist-btn").onclick = function(){

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || []

wishlist.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image
})

localStorage.setItem("wishlist",JSON.stringify(wishlist))

alert("Added to wishlist")

}

/* LOAD REVIEWS */

async function loadReviews(){

const res = await fetch(`${BACKEND_URL}/api/products/${slug}`)
const product = await res.json()

const container = document.getElementById("reviews-list")

container.innerHTML = ""

if(!product.reviews || product.reviews.length === 0){

container.innerHTML = "<p>No reviews yet.</p>"
return

}

product.reviews.forEach(r=>{

container.innerHTML += `

<div class="review">

<strong>${r.name}</strong>

<p>${"⭐".repeat(r.rating)}</p>

<p>${r.comment}</p>

</div>

`

})

}

/* SUBMIT REVIEW */

async function submitReview(){

const name = document.getElementById("review-name").value
const rating = document.getElementById("review-rating").value
const comment = document.getElementById("review-comment").value

await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
rating,
comment
})

})

document.getElementById("review-comment").value=""

loadReviews()

}

/* LOAD RECOMMENDATIONS */

async function loadRecommendations(){

const res = await fetch(`${BACKEND_URL}/api/products/${slug}/recommendations`)

const products = await res.json()

const container = document.getElementById("recommendations")

products.forEach(p=>{

container.innerHTML += `

<div class="product">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}" style="width:100%" loading="lazy">
</a>

<p>${p.name}</p>

<p>₦${p.price}</p>

</div>

`

})

}

/* STRUCTURED DATA FOR GOOGLE */

function createStructuredData(product){

const data = {

"@context": "https://schema.org/",
"@type": "Product",
"name": product.name,
"image": product.image,
"description": product.description,

"offers": {
"@type": "Offer",
"priceCurrency": "NGN",
"price": product.price,
"availability": "https://schema.org/InStock"
}

}

const script = document.createElement("script")

script.type = "application/ld+json"

script.text = JSON.stringify(data)

document.body.appendChild(script)

}

loadProduct()
loadRecommendations()

</script>

</body>
</html>
