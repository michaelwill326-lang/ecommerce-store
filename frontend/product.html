<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
}

img{
max-width:300px;
margin-bottom:20px;
}

button{
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1 id="name"></h1>

<img id="image">

<p id="description"></p>

<h3 id="price"></h3>

<button id="addCart">Add to Cart</button>

</div>

<script>

const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com"

const params = new URLSearchParams(window.location.search)

const slug = params.get("slug")

let productData = null

async function loadProduct(){

const res = await fetch(`${BACKEND_URL}/api/products/${slug}`)

const product = await res.json()

productData = product

document.getElementById("name").innerText = product.name

document.getElementById("description").innerText = product.description

document.getElementById("price").innerText = "₦"+product.price

if(product.image){

document.getElementById("image").src = product.image

}

}

loadProduct()

document.getElementById("addCart").onclick = function(){

let cart = JSON.parse(localStorage.getItem("cart")) || []

const existing = cart.find(i=>i._id===productData._id)

if(existing){

existing.quantity++

}else{

cart.push({
_id:productData._id,
name:productData.name,
price:productData.price,
quantity:1
})

}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

</script>

</body>
</html>
