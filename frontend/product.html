<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product | TechMart</title>

<link rel="stylesheet" href="style.css">

<script type="application/ld+json" id="product-schema"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
padding:30px;
}

#stock-warning{
margin:10px 0;
font-weight:bold;
}

.product-page{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.product-page img{
width:100%;
border-radius:10px;
}

.price{
font-size:26px;
font-weight:bold;
margin:15px 0;
}

button{
padding:10px 16px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}

button:hover{
background:#1d4ed8;
}

.reviews{
margin-top:50px;
}

.review{
background:white;
padding:12px;
margin-bottom:10px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.recommendations{
margin-top:50px;
display:flex;
gap:20px;
flex-wrap:wrap;
}

.product-card{
background:white;
padding:10px;
border-radius:8px;
width:200px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.product-card img{
width:100%;
border-radius:6px;
}

</style>

</head>

<body>

<h1 id="product-name"></h1>

<div class="product-page">

<img id="product-image">

<div>

<p id="product-description"></p>

<div class="price" id="product-price"></div>

<div id="product-rating"></div>

<div id="stock-warning"></div>

<button id="add-cart">Add to Cart</button>
<button id="wishlist-btn">❤️ Wishlist</button>

</div>

</div>

<!-- REVIEWS -->

<div class="reviews">

<h2>Customer Reviews</h2>

<div id="reviews-list"></div>

<h3>Leave a Review</h3>

<input id="review-name" placeholder="Your Name">

<select id="review-rating">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<br><br>

<textarea id="review-comment" placeholder="Write your review"></textarea>

<br><br>

<button onclick="submitReview()">Submit Review</button>

</div>

<!-- RECOMMENDED PRODUCTS -->

<h2>Recommended Products</h2>

<div id="recommendations" class="recommendations"></div>

<!-- CUSTOMERS ALSO BOUGHT -->

<h2>Customers Also Bought</h2>

<div id="also-bought" class="recommendations"></div>


<script>

const BACKEND_URL="https://techmart-backend-ecbi.onrender.com"

const params=new URLSearchParams(window.location.search)
const slug=params.get("slug")

let productData=null

/* LOAD PRODUCT */

async function loadProduct(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}`)
const product=await res.json()

productData=product

document.getElementById("product-name").textContent=product.name
document.getElementById("product-image").src=product.image
document.getElementById("product-description").textContent=product.description || ""
document.getElementById("product-price").textContent="₦"+product.price

const stockWarning=document.getElementById("stock-warning")

if(product.stock <= 5){

stockWarning.innerHTML = `⚠ Only ${product.stock} left in stock!`

stockWarning.style.color = "red"

}
else{

stockWarning.innerHTML = `In Stock (${product.stock})`

stockWarning.style.color = "green"

}
generateSchema(product)

loadReviews()

}

/* PRODUCT SEO SCHEMA */

function generateSchema(product){

let ratingValue=5
let reviewCount=product.reviews.length || 1

if(product.reviews.length>0){

let total=0

product.reviews.forEach(r=>total+=r.rating)

ratingValue=(total/product.reviews.length).toFixed(1)

}

const schema={

"@context":"https://schema.org/",
"@type":"Product",

"name":product.name,
"image":[product.image],
"description":product.description || "Electronic product from TechMart",

"sku":product._id,

"brand":{
"@type":"Brand",
"name":"TechMart"
},

"aggregateRating":{
"@type":"AggregateRating",
"ratingValue":ratingValue,
"reviewCount":reviewCount
},

"offers":{
"@type":"Offer",
"url":window.location.href,
"priceCurrency":"NGN",
"price":product.price,
"priceValidUntil":"2027-12-31",
"itemCondition":"https://schema.org/NewCondition",
"availability":"https://schema.org/InStock"
}

}

document.getElementById("product-schema").textContent=JSON.stringify(schema)

}

/* ADD TO CART */

document.getElementById("add-cart").onclick=function(){

let cart=JSON.parse(localStorage.getItem("cart")) || []

const existing=cart.find(i=>i.id===productData._id)

if(existing){

existing.quantity++

}else{

cart.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image,
quantity:1
})

}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

/* WISHLIST */

document.getElementById("wishlist-btn").onclick=function(){

let wishlist=JSON.parse(localStorage.getItem("wishlist")) || []

const existing=wishlist.find(i=>i.id===productData._id)

if(existing){
alert("Already in wishlist")
return
}

wishlist.push({
id:productData._id,
name:productData.name,
price:productData.price,
image:productData.image
})

localStorage.setItem("wishlist",JSON.stringify(wishlist))

alert("Added to wishlist")

}

/* LOAD REVIEWS */

async function loadReviews(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}`)
const product=await res.json()

const container=document.getElementById("reviews-list")

container.innerHTML=""

if(!product.reviews.length){

container.innerHTML="<p>No reviews yet.</p>"
return

}

product.reviews.forEach(r=>{

container.innerHTML+=`

<div class="review">

<strong>${r.name}</strong>

<p>${"⭐".repeat(r.rating)}</p>

<p>${r.comment}</p>

</div>

`

})

}

/* SUBMIT REVIEW */

async function submitReview(){

const name=document.getElementById("review-name").value
const rating=document.getElementById("review-rating").value
const comment=document.getElementById("review-comment").value

await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
rating,
comment
})

})

document.getElementById("review-comment").value=""

loadReviews()

}

/* RECOMMENDATIONS */

async function loadRecommendations(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}/recommendations`)
const products=await res.json()

const container=document.getElementById("recommendations")

products.forEach(p=>{

container.innerHTML+=`

<div class="product-card">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}">
</a>

<p>${p.name}</p>
<p>₦${p.price}</p>

</div>

`

})

}

/* CUSTOMERS ALSO BOUGHT */

async function loadAlsoBought(){

try{

const res=await fetch(`${BACKEND_URL}/api/products/${slug}/also-bought`)
const products=await res.json()

const container=document.getElementById("also-bought")

container.innerHTML=""

products.forEach(p=>{

container.innerHTML+=`

<div class="product-card">

<a href="product.html?slug=${p.slug}">
<img src="${p.image}">
</a>

<p>${p.name}</p>
<p>₦${p.price}</p>

</div>

`

})

}catch(err){

console.log("Also bought error")

}

}

loadProduct()
loadRecommendations()
loadAlsoBought()

</script>

</body>
</html>
