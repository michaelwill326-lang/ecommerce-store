<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
}

.product{
display:flex;
gap:40px;
}

img{
max-width:350px;
border-radius:8px;
}

.details{
flex:1;
}

button{
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

.review-box{
margin-top:40px;
}

.review{
border-bottom:1px solid #eee;
padding:10px 0;
}

input, textarea{
width:100%;
padding:8px;
margin:5px 0;
border:1px solid #ccc;
border-radius:4px;
}

</style>
</head>

<body>

<div class="container">

<div class="product">

<div>
<img id="image">
</div>

<div class="details">

<h1 id="name"></h1>

<p id="description"></p>

<h2 id="price"></h2>

<button id="addCart">Add to Cart</button>

</div>

</div>

<div class="review-box">

<h2>Customer Reviews</h2>

<div id="reviews"></div>

<h3>Add Review</h3>

<input id="reviewName" placeholder="Your Name">

<input id="rating" type="number" min="1" max="5" placeholder="Rating (1-5)">

<textarea id="comment" placeholder="Write review"></textarea>

<button onclick="submitReview()">Submit Review</button>

</div>

</div>

<script>

const BACKEND_URL="https://techmart-backend-ecbi.onrender.com"

const params=new URLSearchParams(window.location.search)

const slug=params.get("slug")

let productData=null

/* ======================
   LOAD PRODUCT
====================== */

async function loadProduct(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}`)

const product=await res.json()

productData=product

document.getElementById("name").innerText=product.name

document.getElementById("description").innerText=product.description

document.getElementById("price").innerText="₦"+product.price

if(product.image){
document.getElementById("image").src=product.image
}

loadReviews()

}

loadProduct()

/* ======================
   ADD TO CART
====================== */

document.getElementById("addCart").onclick=function(){

let cart=JSON.parse(localStorage.getItem("cart"))||[]

const existing=cart.find(i=>i._id===productData._id)

if(existing){
existing.quantity++
}else{
cart.push({
_id:productData._id,
name:productData.name,
price:productData.price,
quantity:1
})
}

localStorage.setItem("cart",JSON.stringify(cart))

alert("Added to cart")

}

/* ======================
   LOAD REVIEWS
====================== */

async function loadReviews(){

const res=await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`)

const reviews=await res.json()

const container=document.getElementById("reviews")

container.innerHTML=""

reviews.forEach(r=>{

container.innerHTML+=`
<div class="review">
<b>${r.name}</b> ⭐ ${r.rating}/5
<p>${r.comment}</p>
</div>
`

})

}

/* ======================
   SUBMIT REVIEW
====================== */

async function submitReview(){

const name=document.getElementById("reviewName").value

const rating=document.getElementById("rating").value

const comment=document.getElementById("comment").value

await fetch(`${BACKEND_URL}/api/products/${slug}/reviews`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name,
rating,
comment
})

})

document.getElementById("reviewName").value=""
document.getElementById("rating").value=""
document.getElementById("comment").value=""

loadReviews()

}

</script>

</body>
</html>
