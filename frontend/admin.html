<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - TechMart</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.box{
  background:#1e293b;
  padding:30px;
  border-radius:10px;
  width:320px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#3b82f6;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#2563eb;
}

.error{
  color:#f87171;
  margin-top:10px;
  font-size:14px;
}

.loader{
  display:none;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔐 Admin Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div class="loader" id="loader">Logging in...</div>
  <div class="error" id="error"></div>
</div>

<script>

const API = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   ADMIN LOGIN
=========================== */
async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  const errorBox = document.getElementById("error");
  const loader = document.getElementById("loader");

  errorBox.innerText = "";
  loader.style.display = "block";

  if(!email || !password){
    loader.style.display = "none";
    errorBox.innerText = "Please fill all fields";
    return;
  }

  try{

    const res = await fetch(API + "/api/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    loader.style.display = "none";

    console.log("LOGIN RESPONSE:", data);

    if(data.success){

      // save admin token
      localStorage.setItem("adminToken", data.token);

      // redirect to REAL dashboard
      window.location.href = "admin-dashboard.html";

    }else{
      errorBox.innerText = data.message || "Invalid credentials";
    }

  }catch(err){
    loader.style.display = "none";
    errorBox.innerText = "Network error. Try again.";
    console.error(err);
  }
}

/* ===========================
   AUTO REDIRECT IF ALREADY LOGGED IN
=========================== */
if(localStorage.getItem("adminToken")){
  window.location.href = "admin-dashboard.html";
}

</script>

</body>
</html>
