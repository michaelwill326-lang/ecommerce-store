<!DOCTYPE html>

<html>

<head>

<title>TechMart Admin</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:30px;
}

h1{
margin-bottom:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.card h2{
margin-top:0;
}

.stat{
font-size:28px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

button{
padding:6px 10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

input,select{
padding:8px;
margin:5px 0;
width:100%;
}

</style>

</head>

<body>

<h1>TechMart Admin Dashboard</h1>

<!-- DASHBOARD STATS -->

<div class="dashboard">

<div class="card">
<h2>Total Orders</h2>
<div class="stat" id="totalOrders">0</div>
</div>

<div class="card">
<h2>Total Revenue</h2>
<div class="stat" id="totalRevenue">₦0</div>
</div>

<div class="card">
<h2>Top Product</h2>
<div class="stat" id="topProduct">-</div>
</div>

</div>

<!-- SALES CHART -->

<div class="card">

<h2>Sales Chart</h2>

<canvas id="salesChart"></canvas>

</div>

<!-- ADD PRODUCT -->

<div class="card">

<h2>Add Product</h2>

<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price" type="number">

<input id="stock" placeholder="Stock" type="number">

<input id="category" placeholder="Category">

<textarea id="description" placeholder="Description"></textarea>

<input type="file" id="images" multiple>

<button onclick="addProduct()">Add Product</button>

</div>

<!-- PRODUCTS LIST -->

<div class="card">

<h2>Products</h2>

<table>

<thead>

<tr>

<th>Name</th>
<th>Price</th>
<th>Category</th>
<th>Stock</th>
<th>Action</th>

</tr>

</thead>

<tbody id="productsTable"></tbody>

</table>

</div>

<!-- ORDERS -->

<div class="card">

<h2>Orders</h2>

<table>

<thead>

<tr>

<th>Customer</th>
<th>Email</th>
<th>Total</th>
<th>Status</th>
<th>Date</th>

</tr>

</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

let salesChart

async function loadDashboard(){

const res=await fetch(API+"/api/orders")

const orders=await res.json()

const table=document.getElementById("ordersTable")

table.innerHTML=""

let revenue=0

let productCount={}

orders.forEach(o=>{

revenue+=o.totalAmount

table.innerHTML+=`

<tr>

<td>${o.customerName}</td>
<td>${o.email}</td>
<td>₦${o.totalAmount}</td>
<td>${o.status}</td>
<td>${new Date(o.createdAt).toLocaleDateString()}</td>

</tr>

`

o.items.forEach(item=>{
productCount[item.name]=(productCount[item.name]||0)+item.quantity
})

})

document.getElementById("totalOrders").textContent=orders.length
document.getElementById("totalRevenue").textContent="₦"+revenue

let topProduct="-"
let max=0

for(let p in productCount){

if(productCount[p]>max){

max=productCount[p]
topProduct=p

}

}

document.getElementById("topProduct").textContent=topProduct

const dates={}

orders.forEach(o=>{

const d=new Date(o.createdAt).toLocaleDateString()

dates[d]=(dates[d]||0)+o.totalAmount

})

const labels=Object.keys(dates)
const data=Object.values(dates)

const ctx=document.getElementById("salesChart")

if(salesChart){
salesChart.destroy()
}

salesChart=new Chart(ctx,{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Revenue",
data:data,
borderColor:"#2563eb",
fill:false
}]
}
})

}

/* PRODUCTS */

async function loadProducts(){

const res=await fetch(API+"/api/products")

const products=await res.json()

const table=document.getElementById("productsTable")

table.innerHTML=""

products.forEach(p=>{

table.innerHTML+=`

<tr>

<td>${p.name}</td>
<td>₦${p.price}</td>
<td>${p.category||""}</td>
<td>${p.stock}</td>

<td>

<button onclick="deleteProduct('${p._id}')">
Delete
</button>

</td>

</tr>

`

})

}

/* ADD PRODUCT */

async function addProduct(){

const formData=new FormData()

formData.append("name",document.getElementById("name").value)
formData.append("price",document.getElementById("price").value)
formData.append("stock",document.getElementById("stock").value)
formData.append("category",document.getElementById("category").value)
formData.append("description",document.getElementById("description").value)

const files=document.getElementById("images").files

for(let i=0;i<files.length;i++){
formData.append("images",files[i])
}

await fetch(API+"/api/products",{
method:"POST",
body:formData
})

alert("Product added")

loadProducts()

}

/* DELETE PRODUCT */

async function deleteProduct(id){

await fetch(API+"/api/products/"+id,{
method:"DELETE"
})

loadProducts()

}

loadDashboard()
loadProducts()

setInterval(loadDashboard,5000)

</script>

</body>

</html>
