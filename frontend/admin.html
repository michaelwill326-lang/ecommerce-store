<!DOCTYPE html>
<html>

<head>
<title>TechMart Admin</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:8px;
margin:8px 0;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
}
</style>

</head>

<body>

<div class="container">

<h1>📊 TechMart Admin Dashboard</h1>

<!-- LOGIN -->
<div class="card" id="loginCard">

<h2>Admin Login</h2>

<input id="adminEmail" placeholder="Email">
<input id="adminPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<!-- ADD PRODUCT -->
<div class="card">

<h2>Add Product (with Image)</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="stock" placeholder="Stock">
<input id="description" placeholder="Description">

<input type="file" id="image">

<button onclick="addProduct()">Add Product</button>

</div>

<!-- PRODUCTS -->
<div class="card">

<h2>Products</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Price</th>
<th>Stock</th>
</tr>
</thead>

<tbody id="productsTable"></tbody>

</table>

</div>

</div>

</div>

<script>

const API = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   LOGIN
=========================== */
async function login(){

  const email = document.getElementById("adminEmail").value;
  const password = document.getElementById("adminPassword").value;

  try{

    const res = await fetch(API + "/admin/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email,password})
    });

    const data = await res.json();

    console.log("LOGIN:", data);

    if(data.success){

      localStorage.setItem("token", data.token);

      document.getElementById("loginCard").style.display="none";
      document.getElementById("dashboard").style.display="block";

      loadProducts();

    }else{
      alert("Login failed");
    }

  }catch(err){
    console.error(err);
    alert("Network error during login");
  }

}

/* ===========================
   LOAD PRODUCTS
=========================== */
async function loadProducts(){

  const res = await fetch(API + "/api/products");
  const products = await res.json();

  const table = document.getElementById("productsTable");
  table.innerHTML = "";

  products.forEach(p=>{
    table.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>₦${p.price}</td>
        <td>${p.stock}</td>
      </tr>
    `;
  });

}

/* ===========================
   ADD PRODUCT (FIXED)
=========================== */
async function addProduct(){

  const token = localStorage.getItem("token");

  const formData = new FormData();

  formData.append("name", document.getElementById("name").value);
  formData.append("price", document.getElementById("price").value);
  formData.append("stock", document.getElementById("stock").value);
  formData.append("description", document.getElementById("description").value);

  const file = document.getElementById("image").files[0];
  if(file){
    formData.append("image", file);
  }

  try{

    const res = await fetch(API + "/api/products", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token
      },
      body: formData
    });

    const text = await res.text();
    console.log("UPLOAD RESPONSE:", text);

    if(res.ok){
      alert("✅ Product added!");
      loadProducts();
    }else{
      alert("❌ Failed: " + text);
    }

  }catch(err){
    console.error("NETWORK ERROR:", err);
    alert("❌ Network error");
  }

}

/* ===========================
   AUTO LOGIN
=========================== */
if(localStorage.getItem("token")){
  document.getElementById("loginCard").style.display="none";
  document.getElementById("dashboard").style.display="block";
  loadProducts();
}

</script>

</body>

</html>
