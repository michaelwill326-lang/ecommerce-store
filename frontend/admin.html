<!DOCTYPE html>
<html>

<head>

<title>TechMart Admin</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
}

button{
padding:6px 10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>TechMart Admin</h1>

<div class="card">

<h2>Orders</h2>

<table>

<thead>

<tr>

<th>Customer</th>
<th>Email</th>
<th>Total</th>
<th>Status</th>

</tr>

</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

async function loadOrders(){

const res=await fetch(API+"/api/orders")

const orders=await res.json()

const table=document.getElementById("ordersTable")

table.innerHTML=""

orders.forEach(o=>{

table.innerHTML+=`

<tr>

<td>${o.customerName}</td>
<td>${o.email}</td>
<td>₦${o.totalAmount}</td>
<td>${o.status}</td>

</tr>

`

})

}

loadOrders()

</script>

</body>

</html>
