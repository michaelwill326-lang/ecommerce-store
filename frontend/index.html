<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name=<meta name="google-site-verification" content="abc123xyz" />

<title>🛒 TechMart</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111827;
color:white;
position:relative;
}

.nav-links{
display:flex;
gap:20px;
align-items:center;
}

.nav-links a{
color:white;
text-decoration:none;
}

.dropdown{
position:relative;
}

.dropbtn{
background:none;
border:none;
color:white;
cursor:pointer;
}

.dropdown-content{
display:none;
position:absolute;
background:white;
min-width:150px;
border-radius:6px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.dropdown-content a{
display:block;
padding:10px;
color:black;
text-decoration:none;
}

.dropdown:hover .dropdown-content{
display:block;
}

.menu-icon{
display:none;
font-size:24px;
cursor:pointer;
}

@media(max-width:768px){

.nav-links{
display:none;
flex-direction:column;
background:#111827;
position:absolute;
top:60px;
right:0;
width:200px;
padding:10px;
}

.nav-links.show{
display:flex;
}

.menu-icon{
display:block;
}

}

/* HERO */

.hero{
background:linear-gradient(90deg,#2563eb,#1e3a8a);
color:white;
text-align:center;
padding:60px 20px;
}

/* SEARCH */

.search-box{
text-align:center;
margin:30px;
}

.search-box input{
width:350px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

/* FILTERS */

.filters{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
}

.filters select{
padding:8px;
border-radius:6px;
border:1px solid #ccc;
}

/* PRODUCTS */

.section{
max-width:1100px;
margin:auto;
padding:20px;
}

.product-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.product-card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
transition:0.2s;
}

.product-card:hover{
transform:translateY(-4px);
}

.product-image{
text-align:center;
position:relative;
}

.product-image img{
width:160px;
height:160px;
object-fit:contain;
}

.badge{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.product-info{
text-align:center;
}

.price{
font-weight:bold;
margin:6px 0;
}

.actions{
display:flex;
justify-content:center;
gap:10px;
}

.actions button{
border:none;
background:#2563eb;
color:white;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

/* MODAL */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.modal-content{
background:white;
margin:10% auto;
padding:20px;
width:600px;
border-radius:10px;
}

.modal-body{
display:flex;
gap:20px;
}

.modal-body img{
width:200px;
}

.close{
float:right;
font-size:28px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h2>🛒 TechMart</h2>

<nav class="nav-links">

<a href="index.html">Home</a>

<div class="dropdown">

<button class="dropbtn">Categories ▾</button>

<div class="dropdown-content">

<a href="#">Electronics</a>
<a href="#">Gaming</a>
<a href="#">Accessories</a>

</div>

</div>

<a href="account.html">Account</a>
<a href="tracking.html">📦 Track Order</a>
<a href="cart.html">Cart</a>

</nav>

<div class="menu-icon" onclick="toggleMenu()">☰</div>

</header>

<section class="hero">

<h1>TechMart Mega Sale</h1>

<p>Up to 50% Off Electronics</p>

<button onclick="scrollToProducts()">Shop Now</button>

</section>

<div class="search-box">

<input id="searchInput" placeholder="Search products...">

</div>

<div class="filters">

<select id="categoryFilter">
<option value="">All Categories</option>
<option value="electronics">Electronics</option>
<option value="gaming">Gaming</option>
<option value="accessories">Accessories</option>
</select>

<select id="priceFilter">
<option value="">All Prices</option>
<option value="100">Under ₦100</option>
<option value="500">Under ₦500</option>
</select>

<select id="sortFilter">
<option value="">Sort</option>
<option value="low">Price Low → High</option>
<option value="high">Price High → Low</option>
</select>

</div>

<section class="section">

<h2>Featured Products</h2>
<div id="featuredProducts" class="product-list"></div>

</section>

<section class="section">

<h2>Recommended For You</h2>
<div id="recommendedProducts" class="product-list"></div>

</section>

<section class="section">

<h2>All Products</h2>
<div id="products" class="product-list"></div>

</section>

<div id="quickViewModal" class="modal">

<div class="modal-content">

<span class="close" onclick="closeQuickView()">×</span>

<div class="modal-body">

<img id="modalImage">

<div>

<h2 id="modalName"></h2>
<p id="modalPrice"></p>
<p id="modalDescription"></p>

<button id="modalAddCart">Add to Cart</button>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
