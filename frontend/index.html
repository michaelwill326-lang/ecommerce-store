<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 TechMart</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f7fa;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111827;
color:white;
}

nav{
display:flex;
gap:15px;
align-items:center;
}

nav a{
color:white;
text-decoration:none;
}

#searchBox{
padding:8px;
border-radius:6px;
border:none;
}

/* CART */
.cart{
position:relative;
}

.badge{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:2px 6px;
font-size:12px;
}

/* MAIN */
main{
max-width:1200px;
margin:30px auto;
padding:20px;
}

/* GRID */
.product-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

/* CARD */
.product-card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
transition:0.3s;
}

.product-card:hover{
transform:translateY(-5px);
}

/* IMAGE */
.product-image img{
width:100%;
height:200px;
object-fit:cover;
}

/* INFO */
.product-info{
padding:15px;
}

.price{
font-weight:bold;
font-size:18px;
margin:10px 0;
}

/* BUTTONS */
.actions{
display:flex;
gap:8px;
}

.actions button{
flex:1;
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
}

.actions button:first-child{
background:#2563eb;
color:white;
}

.actions button:last-child{
background:#e5e7eb;
}

/* ================= MOBILE ================= */
@media (max-width:768px){

header{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

nav{
flex-wrap:wrap;
}

#searchBox{
width:100%;
}

.product-list{
grid-template-columns:repeat(2,1fr);
}

.product-image img{
height:140px;
}

}

</style>

</head>

<body>

<header>
<h2>🛒 TechMart</h2>

<nav>
<a href="index.html">Home</a>
<a href="account.html">Account</a>

<input type="text" id="searchBox" placeholder="Search...">

<div class="cart">
<a href="cart.html">🛒</a>
<span id="cart-count" class="badge">0</span>
</div>

</nav>
</header>

<main>

<h2>🔥 Products</h2>
<div id="products" class="product-list"></div>

</main>

<script>

const API="https://techmart-backend-ecbi.onrender.com"

async function loadProducts(){

const res = await fetch(API+"/api/products")
const products = await res.json()

const container = document.getElementById("products")
container.innerHTML=""

products.forEach(p=>{
container.innerHTML += `
<div class="product-card">

<div class="product-image">
<img src="${p.image}">
</div>

<div class="product-info">
<h3>${p.name}</h3>
<div class="price">₦${p.price}</div>

<div class="actions">
<button onclick="addToCart('${p._id}')">Add</button>
<button onclick="viewProduct('${p.slug}')">View</button>
</div>

</div>
</div>
`
})

}

function addToCart(id){

let cart = JSON.parse(localStorage.getItem("cart")) || []

const item = cart.find(i=>i.id===id)

if(item){
item.quantity++
}else{
cart.push({id,quantity:1})
}

localStorage.setItem("cart", JSON.stringify(cart))
updateCart()

alert("Added to cart")

}

function viewProduct(slug){
window.location=`product.html?slug=${slug}`
}

function updateCart(){
let cart = JSON.parse(localStorage.getItem("cart")) || []
document.getElementById("cart-count").textContent =
cart.reduce((sum,i)=>sum+i.quantity,0)
}

updateCart()
loadProducts()

</script>

</body>
</html>
