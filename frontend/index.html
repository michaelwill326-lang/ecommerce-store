<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 TechMart</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f7fa;}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111827;
color:white;
}

nav{
display:flex;
gap:15px;
align-items:center;
}

nav a{
color:white;
text-decoration:none;
}

.cart{
position:relative;
}

.badge{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:2px 6px;
font-size:12px;
}

main{
max-width:1200px;
margin:30px auto;
padding:20px;
}

.product-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.product-card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.product-image img{
width:100%;
height:200px;
object-fit:cover;
}

.product-info{
padding:15px;
}

.price{
font-weight:bold;
margin:10px 0;
}

.actions{
display:flex;
gap:8px;
}

.actions button{
flex:1;
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
}

.actions button:first-child{
background:#2563eb;
color:white;
}
</style>
</head>

<body>

<header>
<h2>🛒 TechMart</h2>

<nav>
<a href="index.html">Home</a>
<a href="account.html">Account</a>

<div class="cart">
<a href="cart.html">🛒</a>
<span id="cart-count" class="badge">0</span>
</div>
</nav>
</header>

<main>
<h2>🔥 Products</h2>
<div id="products" class="product-list"></div>
</main>

<script>

const API = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   LOAD PRODUCTS
=========================== */
async function loadProducts(){

  const res = await fetch(API + "/api/products");
  const products = await res.json();

  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach(p => {

    container.innerHTML += `
      <div class="product-card">

        <div class="product-image">
          <img src="${p.image || 'https://dummyimage.com/200x200/000/fff'}">
        </div>

        <div class="product-info">
          <h3>${p.name}</h3>
          <div class="price">₦${p.price}</div>

          <div class="actions">
            <!-- ✅ CORRECT BUTTON -->
            <button onclick="addToCart('${p._id}', '${p.name}', ${p.price}, '${p.image}')">
              Add
            </button>
          </div>
        </div>

      </div>
    `;
  });
}

/* ===========================
   ADD TO CART (FINAL FIX)
=========================== */
function addToCart(id, name, price, image){

  console.log("ADDING:", id, name, price);

  price = Number(price);

  if(!id || !name || isNaN(price)){
    alert("❌ Product error");
    console.error({id, name, price});
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const existing = cart.find(item => item.id === id);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      id,
      name,
      price,
      image,
      quantity: 1
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  updateCart();

  alert("Added to cart");
}

/* ===========================
   CART COUNT
=========================== */
function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").textContent =
    cart.reduce((sum,i)=>sum+i.quantity,0);
}

/* INIT */
updateCart();
loadProducts();

</script>

</body>
</html>
