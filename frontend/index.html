<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMart Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Initialize socket connection
    const socket = io();

    // Listen for new orders
    socket.on("order:new", (order) => {
      console.log("New Order: ", order);
      // You can update your order table here or show a notification
    });

    // Listen for new reviews
    socket.on("review:new", (data) => {
      console.log("New Review for Product ID: ", data.productId);
      // Update product reviews on the dashboard
    });

    // Listen for job status updates
    socket.on("job:status", (status) => {
      console.log("Job Status: ", status);
      // Update your job monitoring dashboard
    });
  </script>
</head>
<body>
  <h1>Welcome to TechMart Dashboard</h1>
  <div id="orders">
    <h2>New Orders</h2>
    <!-- Orders will be dynamically inserted here -->
  </div>

  <div id="reviews">
    <h2>New Reviews</h2>
    <!-- Reviews will be dynamically inserted here -->
  </div>

  <div id="jobs">
    <h2>Job Status</h2>
    <!-- Job statuses will be dynamically inserted here -->
  </div>

  <button onclick="window.location.href='/about'">About</button>
  <button onclick="window.location.href='/contact'">Contact</button>
  <button onclick="window.location.href='/policies'">Policies</button>
</body>
</html>
