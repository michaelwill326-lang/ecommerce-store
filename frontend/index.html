<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 TechMart</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial, sans-serif;
background:#f4f6f9;
margin:0;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111827;
color:white;
}

header nav{
display:flex;
gap:20px;
align-items:center;
}

header a{
color:white;
text-decoration:none;
}

/* CART BADGE */

.cart-icon-wrapper{
position:relative;
}

.badge{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:3px 7px;
font-size:12px;
}

/* MAIN */

main{
max-width:1200px;
margin:auto;
padding:30px;
}

/* PRODUCT GRID */

.product-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:25px;
}

/* PRODUCT CARD */

.product-card{
background:white;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
overflow:hidden;
transition:0.2s;
}

.product-card:hover{
transform:translateY(-4px);
}

.product-image{
position:relative;
}

.product-image img{
width:100%;
height:200px;
object-fit:cover;
}

.badge-new{
position:absolute;
top:10px;
left:10px;
background:#22c55e;
color:white;
padding:4px 8px;
font-size:12px;
border-radius:4px;
}

.product-info{
padding:15px;
}

.product-info h3{
margin:5px 0;
font-size:18px;
}

.rating{
color:#fbbf24;
margin:5px 0;
}

.price{
font-weight:bold;
font-size:18px;
margin:8px 0;
}

.actions{
display:flex;
gap:8px;
}

.actions button{
flex:1;
padding:8px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.actions button:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

    <header>

        <h1>🛒 TechMart</h1>
        
        <nav>
        
        <a href="index.html">Home</a>
        
        <a href="account.html">Account</a>
        
        <div class="search-container">
        
        <input 
        type="text" 
        id="searchBox"
        placeholder="Search TechMart products..."
        >
        
        <div id="search-results"></div>
        
        </div>
        
        <div class="cart-icon-wrapper">
        
        <a href="cart.html">🛒 Cart</a>
        
        <span id="cart-count" class="badge">0</span>
        
        </div>
        
        </nav>
        
  </header>

<main>

    <h2>🔥 Trending Products</h2>

    <div id="trending" class="product-list"></div>
    
    <h2>All Products</h2>

<div id="products" class="product-list"></div>

</main>

<script src="script.js"></script>

</body>
</html>
