<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 TechMart</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial, sans-serif;
background:#f4f6f9;
margin:0;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#111827;
color:white;
}

header h1{
margin:0;
}

/* NAVIGATION */

header nav{
display:flex;
align-items:center;
gap:20px;
}

header a{
color:white;
text-decoration:none;
font-weight:500;
}

header a:hover{
text-decoration:underline;
}

/* CART BADGE */

.cart-icon-wrapper{
position:relative;
}

.badge{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:3px 7px;
font-size:12px;
}

/* MAIN */

main{
max-width:1100px;
margin:auto;
padding:30px;
}

.search-box{
margin-bottom:20px;
}

.search-box input{
width:100%;
max-width:400px;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

/* PRODUCTS GRID */

.product-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
text-align:center;
}

.product img{
width:150px;
margin-bottom:10px;
}

.product h3{
margin:10px 0;
}

.product button{
margin-top:10px;
padding:8px 14px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.product button:hover{
background:#1d4ed8;
}

/* LOADING */

.spinner{
display:none;
text-align:center;
margin-top:40px;
font-size:20px;
}

</style>

</head>

<body>

<header>

<h1>🛒 TechMart</h1>

<nav>

<a href="index.html">Home</a>

<a href="account.html">Account</a>

<div class="cart-icon-wrapper">

<a href="cart.html">🛒 Cart</a>

<span id="cart-count" class="badge">0</span>

</div>

</nav>

</header>

<main>

<h2>Products</h2>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔎 Search products..."

>

</div>

<div id="loading-spinner" class="spinner">
Loading products...
</div>

<div id="products" class="product-list"></div>

</main>

<script src="script.js"></script>

</body>
</html>
