<script>

    const BACKEND_URL = "https://techmart-backend-ecbi.onrender.com";
    
    /* ===========================
       GET URL PARAM
    =========================== */
    function getTrackingFromURL(){
      const params = new URLSearchParams(window.location.search);
      return params.get("tracking");
    }
    
    /* ===========================
       TRACK ORDER
    =========================== */
    function trackOrder(trackingParam){
    
      const tracking = trackingParam || document.getElementById("trackingInput").value.trim();
    
      if(!tracking){
        alert("Enter tracking number");
        return;
      }
    
      fetch(`${BACKEND_URL}/api/track/${tracking}`)
      .then(res=>{
        if(!res.ok){
          throw new Error("Not found");
        }
        return res.json();
      })
      .then(order=>{
        renderOrder(order);
      })
      .catch(()=>{
        document.getElementById("result").innerHTML =
          "<p style='color:red;'>Order not found</p>";
      });
    
    }
    
    /* ===========================
       RENDER ORDER
    =========================== */
    function renderOrder(order){
    
      const steps = ["Processing","Shipped","Delivered"];
      const currentIndex = steps.indexOf(order.status);
    
      const progressHTML = steps.map((step,index)=>{
        const active = index <= currentIndex ? "active" : "";
    
        return `
          <div class="step">
            <div class="circle ${active}">${index+1}</div>
            <p>${step}</p>
            <div class="line"></div>
          </div>
        `;
      }).join("");
    
      document.getElementById("result").innerHTML = `
        <div class="order-info">
          <p><strong>Customer:</strong> ${order.customerName}</p>
          <p><strong>Email:</strong> ${order.email}</p>
          <p><strong>Total:</strong> ₦${order.totalAmount}</p>
          <p><strong>Status:</strong> ${order.status}</p>
          <p><strong>Tracking:</strong> ${order.trackingNumber}</p>
    
          <div class="progress">
            ${progressHTML}
          </div>
        </div>
      `;
    }
    
    /* ===========================
       AUTO LOAD
    =========================== */
    window.onload = () => {
      const tracking = getTrackingFromURL();
    
      if(tracking){
        document.getElementById("trackingInput").value = tracking;
        trackOrder(tracking);
      }
    };
    
    </script>
