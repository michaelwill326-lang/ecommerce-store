<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - TechMart</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:40px;
  text-align:center;
}

.container{
  background:white;
  padding:25px;
  border-radius:10px;
  max-width:500px;
  margin:auto;
}

button{
  padding:12px;
  width:100%;
  background:green;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

.total{
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h2>🛒 Checkout</h2>

<div id="cartItems"></div>

<p class="total">Total: ₦<span id="total">0</span></p>

<button onclick="placeOrder()">Place Order</button>

</div>

<script>

const API = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   LOAD CART
=========================== */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartDiv = document.getElementById("cartItems");
const totalSpan = document.getElementById("total");

let total = 0;

cart.forEach(item => {

  total += item.price;

  cartDiv.innerHTML += `
    <div class="cart-item">
      <span>${item.name}</span>
      <span>₦${item.price}</span>
    </div>
  `;
});

totalSpan.textContent = total;

/* ===========================
   PLACE ORDER
=========================== */
async function placeOrder(){

  const token = localStorage.getItem("token");

  if(!token){
    alert("Please login first");
    window.location = "login.html";
    return;
  }

  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  try{

    const res = await fetch(API + "/api/create-order",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
      },
      body: JSON.stringify({
        totalAmount: total
      })
    });

    const data = await res.json();

    if(data.success){

      alert("✅ Order placed!");

      // CLEAR CART
      localStorage.removeItem("cart");

      // REDIRECT
      window.location = "account.html";

    }else{
      alert("❌ Failed to place order");
    }

  }catch(err){
    console.error(err);
    alert("❌ Network error");
  }

}

</script>

</body>
</html>
