<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - TechMart</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:40px;
  text-align:center;
}

.container{
  background:white;
  padding:25px;
  border-radius:10px;
  max-width:500px;
  margin:auto;
}

button{
  padding:12px;
  width:100%;
  background:green;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

.total{
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h2>🛒 Checkout</h2>

<div id="cartItems"></div>

<p class="total">Total: ₦<span id="total">0</span></p>

<button onclick="initializePayment()">Pay Now</button>

</div>

<script>
const API = "https://techmart-backend-ecbi.onrender.com";

/* ===========================
   LOAD CART (FIXED)
=========================== */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartDiv = document.getElementById("cartItems");
const totalSpan = document.getElementById("total");

let total = 0;

cart.forEach(item => {

  const name = item.name || "Item";
  const price = Number(item.price) || 0;
  const quantity = Number(item.quantity) || 1;

  const itemTotal = price * quantity;
  total += itemTotal;

  cartDiv.innerHTML += `
    <div class="cart-item">
      <span>${name} x${quantity}</span>
      <span>₦${itemTotal}</span>
    </div>
  `;
});

// ✅ VERY IMPORTANT FIX
total = Math.round(total);

totalSpan.textContent = total;

/* ===========================
   PAYSTACK PAYMENT (FINAL)
=========================== */
async function initializePayment(){

  const user = JSON.parse(localStorage.getItem("user"));

  if(!user){
    alert("Please login first");
    window.location = "login.html";
    return;
  }

  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  // ✅ SAFETY CHECK
  if(!total || total <= 0){
    alert("❌ Invalid total amount");
    console.error("BAD TOTAL:", total);
    return;
  }

  try{

    // Save cart for success page
    localStorage.setItem("pendingCart", JSON.stringify(cart));

    const res = await fetch(API + "/initialize-payment",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        email: user.email || "test@email.com",
        amount: total // ✅ correct (backend multiplies by 100)
      })
    });

    const data = await res.json();

    console.log("PAYSTACK RESPONSE:", data);

    // ✅ FINAL FIX
    if(data.authorization_url){
      window.location.href = data.authorization_url;
    }else{
      alert("❌ Payment failed");
      console.error(data);
    }

  }catch(err){
    console.error(err);
    alert("❌ Network error");
  }

}
</script>

</body>
</html>
