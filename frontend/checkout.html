<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.container{max-width:500px;margin:auto;background:white;padding:20px;border-radius:10px}
input,select{width:100%;padding:10px;margin:5px 0}
button{width:100%;padding:12px;background:green;color:white;border:none;margin-top:10px}
.total{font-weight:bold;margin-top:10px}
</style>
</head>

<body>

<div class="container">

<h3>📍 Saved Addresses</h3>

<select id="savedAddresses">
<option value="">Select saved address</option>
</select>

<button onclick="saveAddress()">💾 Save This Address</button>

<h2>🚚 Delivery Address</h2>

<input id="fullName" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="street" placeholder="Street">
<input id="city" placeholder="City">
<input id="state" placeholder="State">
<input id="country" value="Nigeria">
<input id="postalCode" placeholder="Postal Code">

<h3>🛒 Order</h3>
<div id="cartItems"></div>

<p>Shipping: ₦<span id="shipping">0</span></p>
<p class="total">Total: ₦<span id="total">0</span></p>

<button onclick="initializePayment()">Pay Now</button>

</div>

<script>

const API="https://techmart-backend-ecbi.onrender.com";

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let subtotal = 0;

cart.forEach(item=>{
  subtotal += item.price * item.quantity;

  cartItems.innerHTML += `
    <p>${item.name} x${item.quantity} - ₦${item.price * item.quantity}</p>
  `;
});

/* SHIPPING */
function calculateShipping(state){
  state = state.toLowerCase();

  if(state.includes("lagos")) return 2000;
  if(state.includes("abuja")) return 3000;

  return 5000;
}

state.addEventListener("input", updateTotal);

function updateTotal(){
  const shipping = calculateShipping(state.value);
  document.getElementById("shipping").textContent = shipping;
  document.getElementById("total").textContent = subtotal + shipping;
}

updateTotal();

/* LOAD ADDRESSES */
async function loadAddresses(){

  const token = localStorage.getItem("token");

  const res = await fetch(API+"/api/addresses",{
    headers:{ Authorization:"Bearer " + token }
  });

  const addresses = await res.json();

  const select = document.getElementById("savedAddresses");

  select.innerHTML = `<option value="">Select saved address</option>`;

  addresses.forEach((addr,i)=>{
    select.innerHTML += `
      <option value="${i}">
        ${addr.street}, ${addr.city}
      </option>
    `;
  });

  window.savedAddresses = addresses;
}

/* SELECT ADDRESS */
savedAddresses.addEventListener("change", function(){

  const addr = window.savedAddresses[this.value];
  if(!addr) return;

  fullName.value = addr.fullName;
  phone.value = addr.phone;
  street.value = addr.street;
  city.value = addr.city;
  state.value = addr.state;
  country.value = addr.country;
  postalCode.value = addr.postalCode;

  updateTotal();
});

/* SAVE ADDRESS */
async function saveAddress(){

  const token = localStorage.getItem("token");

  const address = {
    fullName: fullName.value,
    phone: phone.value,
    street: street.value,
    city: city.value,
    state: state.value,
    country: country.value,
    postalCode: postalCode.value
  };

  const res = await fetch(API+"/api/save-address",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer " + token
    },
    body: JSON.stringify(address)
  });

  const data = await res.json();

  if(data.success){
    alert("✅ Address saved");
    loadAddresses();
  }
}

/* PAYMENT */
async function initializePayment(){

  const user = JSON.parse(localStorage.getItem("user"));

  const address = {
    fullName: fullName.value,
    phone: phone.value,
    street: street.value,
    city: city.value,
    state: state.value,
    country: country.value,
    postalCode: postalCode.value
  };

  const shippingFee = calculateShipping(address.state);
  const total = subtotal + shippingFee;

  const res = await fetch(API+"/initialize-payment",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email: user.email,
      phone: address.phone,
      amount: total,
      items: cart,
      userId: user._id,
      address,
      shippingFee
    })
  });

  const data = await res.json();

  window.location.href = data.authorization_url;
}

/* INIT */
loadAddresses();

</script>

<footer style="text-align:center;padding:20px;background:#111;color:#fff">
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="terms.html">Terms</a>
  <p>© 2026 TechMart</p>
</footer>

</body>
</html>
