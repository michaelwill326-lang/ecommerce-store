<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - TechMart</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 40px;
  text-align: center;
}
.container {
  background: white;
  padding: 25px;
  border-radius: 10px;
  max-width: 600px;
  margin: auto;
}
.cart-item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}
button {
  padding: 8px 12px;
  margin-left: 5px;
  cursor: pointer;
}
.total {
  font-weight: bold;
  margin-top: 20px;
}
.clear-btn, .checkout-btn {
  padding: 12px;
  width: 100%;
  background: green;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <h2>🛒 Your Cart</h2>
  <div id="cartItems"></div>
  <p class="total">Total: ₦<span id="total">0</span></p>
  <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
  <button class="checkout-btn" onclick="goToCheckout()">Checkout</button>
</div>

<script src="script.js"></script>

</body>
</html>
