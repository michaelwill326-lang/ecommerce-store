<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkout-container">
    <h2>🛒 Your Shopping Cart</h2>

    <div id="cart-items"></div>

    <p id="cart-total" style="text-align:right; font-size:18px; font-weight:bold; margin-top:15px;">
      Total: $0.00
    </p>

    <div style="display:flex; justify-content:space-between; margin-top:20px;">
      <button class="clear-cart-btn" id="clear-cart">Clear Cart</button>
      <button class="back-to-shop-btn" id="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <script>
    const cartItemsDiv = document.getElementById("cart-items");
    const cartTotalEl = document.getElementById("cart-total");

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // Render cart items
    function renderCart() {
      cartItemsDiv.innerHTML = "";

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
        cartTotalEl.textContent = "Total: $0.00";
        return;
      }

      cart.forEach(item => {
        const div = document.createElement("div");
        div.className = "ordered-product";

        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="ordered-product-details">
            <p><strong>${item.name}</strong></p>
            <p>Price: $${item.price.toFixed(2)}</p>
            <p>
              Quantity:
              <button class="decrease" data-id="${item.id}">−</button>
              ${item.quantity}
              <button class="increase" data-id="${item.id}">+</button>
            </p>
            <button class="remove-item-btn" data-id="${item.id}">Remove</button>
          </div>
        `;

        cartItemsDiv.appendChild(div);
      });

      updateTotal();
      attachEventListeners();
    }

    // Update total price
    function updateTotal() {
      const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );
      cartTotalEl.textContent = `Total: $${total.toFixed(2)}`;
    }

    // Attach button events
    function attachEventListeners() {

      document.querySelectorAll(".increase").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const item = cart.find(i => i.id === id);
          item.quantity++;
          saveCart();
          renderCart();
        });
      });

      document.querySelectorAll(".decrease").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const item = cart.find(i => i.id === id);

          if (item.quantity > 1) {
            item.quantity--;
          } else {
            cart = cart.filter(i => i.id !== id);
          }

          saveCart();
          renderCart();
        });
      });

      document.querySelectorAll(".remove-item-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          cart = cart.filter(i => i.id !== id);
          saveCart();
          renderCart();
        });
      });
    }

    function saveCart() {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    document.getElementById("clear-cart").addEventListener("click", () => {
      cart = [];
      saveCart();
      renderCart();
    });

    document.getElementById("checkout-btn").addEventListener("click", () => {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      window.location.href = "checkout.html";
    });

    renderCart();
  </script>

</body>
</html>
