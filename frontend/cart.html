<title>Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.container{max-width:800px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:15px}
button{padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>

</head>

<body>

<div class="container">

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div class="card">
  <h3 id="subtotal"></h3>
  <p>Shipping: ₦2000</p>
  <h2 id="total"></h2>
  <button onclick="checkout()">Proceed to Payment</button>
</div>

</div>

<script>
const API = "https://techmart-backend-ecbi.onrender.com";

function loadCart(){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const container = document.getElementById("cartItems");

  container.innerHTML = "";

  cart.forEach((item,index)=>{
    container.innerHTML += `
      <div class="card">
        <h4>${item.name}</h4>
        <p>₦${item.price} x ${item.quantity}</p>
        <button onclick="removeItem(${index})">Remove</button>
      </div>
    `;
  });

  calculateTotal();
}

function removeItem(i){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(i,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function calculateTotal(){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let subtotal = cart.reduce((sum,i)=> sum + (i.price*i.quantity),0);
  let shipping = 2000;
  let total = subtotal + shipping;

  document.getElementById("subtotal").innerText = "Subtotal: ₦"+subtotal;
  document.getElementById("total").innerText = "Total: ₦"+total;

  return total;
}

async function checkout(){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = calculateTotal();

  const res = await fetch(API+"/initialize-payment",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      email:"test@email.com",
      amount:total,
      items:cart
    })
  });

  const data = await res.json();
  window.location = data.authorization_url;
}

loadCart();
</script>
